/* ================= HELPERS ================= */
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const slug = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const norm = s => String(s || '').replace(/[’`´]/g, "'").replace(/-/g, ' ').replace(/\s+/g, ' ').trim();
function rng(seed) { let h = 1779033703 ^ seed.length; for (let i = 0; i < seed.length; i++) { h = Math.imul(h ^ seed.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; } return () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); return ((h ^= h >>> 16) >>> 0) / 4294967296; }; }
function shuffle(arr, seed) { const a = arr.slice(), r = rng(seed); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
// check: returns 'ok' | 'cap' | 'bad'
function check(input, item) {
  const x = norm(input), list = [item.a].concat(item.alt || []);
  for (const a of list) if (x === norm(a)) return 'ok';
  for (const a of list) if (x.toLowerCase() === norm(a).toLowerCase()) return item.cap ? 'cap' : 'ok';
  return 'bad';
}
function diffHtml(wrong, right) { // highlight letters of `right` not matched by LCS with `wrong`

/* ================= FIREBASE (REST + SSE) ================= */
let S = {}; // mirror of aulas/SALA
const url = p => `${DB}/aulas/${SALA}${p ? '/' + p : ''}.json`;
let queue = JSON.parse(localStorage.getItem('spellit_q_' + SALA) || '[]');
function saveQ() { localStorage.setItem('spellit_q_' + SALA, JSON.stringify(queue)); }
async function send(method, path, body) {
  queue.push({ method, path, body }); saveQ(); flush();
}
let flushing = false;
async function flush() {
  if (flushing) return; flushing = true;
  while (queue.length) {
    const j = queue[0];
    try {
      const r = await fetch(url(j.path), { method: j.method, body: j.body === undefined ? undefined : JSON.stringify(j.body) });
      if (!r.ok) throw 0; queue.shift(); saveQ(); $('#net').style.display = 'none';
    } catch (e) { $('#net').style.display = 'block'; await new Promise(r => setTimeout(r, 2500)); }
  }
  flushing = false;
}
function setPath(path, data, merge) {
  const parts = path.split('/').filter(Boolean);
  if (!parts.length) { if (merge) S = Object.assign(S || {}, data); else S = data || {}; return; }
  let o = S; for (let i = 0; i < parts.length - 1; i++) { if (typeof o[parts[i]] !== 'object' || o[parts[i]] === null) o[parts[i]] = {}; o = o[parts[i]]; }
  const k = parts[parts.length - 1];
  if (merge) { o[k] = Object.assign(typeof o[k] === 'object' && o[k] ? o[k] : {}, data); for (const x in data) if (data[x] === null) delete o[k][x]; }
  else if (data === null) delete o[k]; else o[k] = data;
}
function listen(onChange) {
  const es = new EventSource(url(''));
  es.addEventListener('put', e => { const d = JSON.parse(e.data); setPath(d.path, d.data, false); onChange(); });
  es.addEventListener('patch', e => { const d = JSON.parse(e.data); setPath(d.path, d.data, true); onChange(); });
  es.onerror = () => { $('#net').style.display = 'block'; };
  es.onopen = () => { if (!queue.length) $('#net').style.display = 'none'; };
}
const names = () => Object.values((S.config || {}).names || {});
const stageNow = () => (S.config && typeof S.config.stage === 'number') ? S.config.stage : -1;
const players = () => S.players || {};
function ranking() { return Object.entries(players()).map(([id, p]) => ({ id, name: p.name, score: p.score || 0 })).sort((a, b) => b.score - a.score); }
function stageItems(st, pid) {
  const s = STAGES[st]; if (s.live) return s.items;
  const lv = [1, 2, 3].map(l => shuffle(s.items.filter(i => i.lv === l), pid + s.key + l));
  return [].concat(...lv);
}

function confirmBox(msg, ok) {
  const d = document.createElement('div'); d.className = 'confirm';
  d.innerHTML = `<div class="card"><p style="font-weight:600">${msg}</p><div class="row"><button class="btn sec" id="cn">Cancel</button><button class="btn" id="cy">Yes</button></div></div>`;
  document.body.appendChild(d); d.querySelector('#cn').onclick = () => d.remove(); d.querySelector('#cy').onclick = () => { d.remove(); ok(); };
}

/* ================= STUDENT ================= */
function initStudent() {
  let me = JSON.parse(localStorage.getItem('spellit_me_' + SALA) || 'null'); // {id,pin}
  let pick = null, cur = { st: null, i: null, bonus: false }, lock = false, qStart = 0, sdShown = null;
  const P = () => (me && players()[me.id]) || null;
  listen(render);
  function header() { const p = P(); const r = ranking().findIndex(x => x.id === me.id) + 1; return topBar(p ? `<span class="pill">${esc(p.name)} · ${p.score || 0} pts${r ? ' · #' + r : ''}</span>` : ''); }
  function render() {
    if (!S.config) { app.innerHTML = topBar() + `<div class="wrap"><div class="card wait"><div class="big">⏳</div><h2>Waiting for the teacher…</h2></div></div>`; return; }
    if (!me || !P() || P().pin !== me.pin) return login();
    const st = stageNow();
    if (st < 0) { cur.st = null; return waitScreen('You\'re in! 🎉', 'Wait for the teacher to start the game.'); }
    if (STAGES[st].live) return showdown();
    const items = stageItems(st, me.id), prog = ((P().st || {})[st]) || {};
    const i = prog.i || 0;
    if (i >= items.length) {
      if (cur.st === st && cur.bonus) return updateHeaderOnly();
      if (cur.st === st && cur.done) return updateHeaderOnly();
      cur = { st, i: null, bonus: false, done: true }; return stageDone(st, prog);
    }
    if (cur.st === st && cur.i === i) return updateHeaderOnly();
    cur = { st, i, bonus: false }; question(st, items, i);
  }
  function updateHeaderOnly() { const t = document.querySelector('.top'); if (t) t.outerHTML = header(); }
  function waitScreen(h, sub) {
    const r = ranking(), pos = r.findIndex(x => x.id === me.id) + 1;
    app.innerHTML = header() + `<div class="wrap"><div class="card wait"><h2>${h}</h2><p class="mut">${sub}</p>${pos ? `<p class="mut" style="margin-top:20px">Your position</p><div class="rankme">#${pos}</div>` : ''}${badges()}</div></div>`;
  }
  function badges() { const b = (P() || {}).badges || {}; return Object.keys(b).length ? '<div style="margin-top:10px">' + Object.keys(b).map(k => `<span class="badge">${k === 'streak' ? '🔥 Perfect streak' : '🚀 Comeback'}</span>`).join('') + '</div>' : ''; }
  function login() {
    const list = names();
    if (!pick) {
      app.innerHTML = topBar() + `<div class="wrap"><div class="card"><h1>Spell It! ✏️</h1><p class="mut">Tap your name.</p><div class="names">${list.map(n => `<button data-n="${esc(n)}">${esc(n)}</button>`).join('')}</div></div></div>`;
      app.querySelectorAll('.names button').forEach(b => b.onclick = () => { pick = b.dataset.n; login(); });
      return;
    }
    const id = slug(pick), p = players()[id], has = p && p.pin;
    app.innerHTML = topBar() + `<div class="wrap"><div class="card"><h2>${esc(pick)}</h2><p class="mut">${has ? 'Type your PIN (2 numbers).' : 'Create a PIN with 2 numbers. Don\'t forget it!'}</p>
      <input class="pin" id="pin" inputmode="numeric" maxlength="2" autocomplete="off" placeholder="••"><div id="er" class="mut" style="color:var(--bad);margin-top:6px"></div>
      <div class="row"><button class="btn sec" id="bk">Back</button><button class="btn" id="ok">${has ? 'Enter' : 'Create PIN'}</button></div></div></div>`;
    $('#pin').focus();
    $('#bk').onclick = () => { pick = null; login(); };
    $('#ok').onclick = () => {
      const v = $('#pin').value.trim(); if (!/^\d{2}$/.test(v)) { $('#er').textContent = 'Use 2 numbers.'; return; }
      if (has && p.pin !== v) { $('#er').textContent = 'Wrong PIN. Ask your teacher.'; return; }
      me = { id, pin: v }; localStorage.setItem('spellit_me_' + SALA, JSON.stringify(me));
      if (!has) { setPath('players/' + id, Object.assign(p || {}, { name: pick, pin: v, score: (p && p.score) || 0 }), false); send('PATCH', 'players/' + id, { name: pick, pin: v, score: (p && p.score) || 0 }); }
      pick = null; render();
    };
  }
  function award(st, item, res, extra) { // res ok|cap|bad ; extra {bonus}
    const p = P(); let pts = 0, streak = p.streak || 0;
    if (res === 'ok') { streak++; pts = extra.bonus ? 50 : 100; if (!extra.bonus && Date.now() - qStart < 8000) pts += 10; if (streak >= 3) pts += Math.min(30, (streak - 2) * 10); }
    else if (res === 'cap') { streak = 0; pts = extra.bonus ? 25 : 50; }
    else streak = 0;
    const upd = { score: (p.score || 0) + pts, streak };
    if (streak >= 6) upd['badges/streak'] = true;
    if (res !== 'ok' && !extra.bonus) upd['miss/' + st + '/' + item.id] = true;
    return { pts, upd };
  }
  function commit(st, upd, nextI, correct, bonus) {
    const p = P(); const prog = ((p.st || {})[st]) || {};
    if (!bonus) { upd['st/' + st + '/i'] = nextI; upd['st/' + st + '/c'] = (prog.c || 0) + (correct ? 1 : 0); }
    else upd['st/' + st + '/b'] = (prog.b || 0) + 1;
    // local mirror then server
    for (const k in upd) setPath('players/' + me.id + '/' + k, upd[k], false);
    send('PATCH', 'players/' + me.id, upd);
  }
  function question(st, items, i, bonusItem) {
    const s = STAGES[st], it = bonusItem || items[i], bonus = !!bonusItem;
    lock = false; qStart = Date.now();
    const total = items.length;
    const lvl = bonus ? 'Bonus lap · +50' : ['', 'Level 1 · Recognize', 'Level 2 · Build', 'Level 3 · Write'][it.lv || 3];
    let body = '';
    if (it.t === 'choose') body = promptHtml(it.p) + `<div class="opts ${it.o.length > 3 && it.o.every(o => o.length < 12) ? 'g2' : ''}">${shuffle(it.o, me.id + it.id).map(o => `<button data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
    if (it.t === 'type') body = promptHtml(it.p) + (it.h ? `<div style="text-align:center" class="hint">${it.h}</div>` : '') + `<input class="ans" id="ans" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="type here"><div class="row"><button class="btn" id="go">Check</button></div>`;
    if (it.t === 'tiles') { const letters = shuffle(it.a.toUpperCase().split(''), me.id + it.id + 't'); body = promptHtml(it.p) + `<div class="built" id="built"></div><div class="tiles">${letters.map((l, k) => `<button data-k="${k}">${l}</button>`).join('')}</div><div class="row"><button class="btn sec" id="del">⌫ Delete</button><button class="btn" id="go">Check</button></div>`; }
    if (it.t === 'ticket') body = promptHtml(it.p) + `<div class="ticket">${it.its.map((x, k) => `<div class="titem"><span class="e">${x.e}</span><input data-k="${k}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></div>`).join('')}</div><div class="row"><button class="btn" id="go">Send order</button></div>`;
    if (it.t === 'fix') body = `<div class="prompt"><div class="ptext">Tap the word with a spelling mistake.</div></div><div class="words">${it.s.split(' ').map((w, k) => `<button data-w="${k}">${esc(w)}</button>`).join('')}</div><div id="fixin" style="display:none"><input class="ans" id="ans" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="write it correctly"><div class="row"><button class="btn" id="go">Check</button></div></div>`;
    const timed = s.timed && !bonus;
    app.innerHTML = header() + `<div class="wrap"><div class="card"><div class="stage-h"><div><div class="lvl">${lvl}</div><b>${esc(s.game)}</b></div><span class="mut">${bonus ? '⭐' : (i + 1) + ' / ' + total}</span></div>
      ${bonus ? '' : `<div class="bar"><i style="width:${i / total * 100}%"></i></div>`}${timed ? '<div class="timer" style="margin-top:8px"><i id="tm"></i></div>' : ''}
      <div id="q">${body}</div><div id="fb"></div></div></div>`;
    let tmr = null;
    if (timed) { const T = s.timed * 1000; tmr = setInterval(() => { const left = Math.max(0, 1 - (Date.now() - qStart) / T); const el = $('#tm'); if (el) el.style.width = left * 100 + '%'; if (left <= 0) { clearInterval(tmr); finish('bad', it.a, true); } }, 100); }
    const finish = (res, typed, timeout) => {
      if (lock) return; lock = true; if (tmr) clearInterval(tmr);
      const { pts, upd } = award(st, it, res, { bonus });
      const fb = $('#fb');
      if (res === 'ok') fb.innerHTML = `<div class="fb ok">Correct! +${pts}</div>`;
      else if (res === 'cap') fb.innerHTML = `<div class="fb half">Almost! Capital letter! +${pts}<div class="cw">${esc(it.a)}</div></div>`;
      else fb.innerHTML = `<div class="fb bad">${timeout ? 'Time\'s up!' : 'Not quite.'} The correct spelling is:<div class="cw">${it.t === 'choose' ? esc(it.a) : diffHtml(typed || '', it.a)}</div></div>`;
      const needRetype = res === 'bad' && it.t !== 'choose' && it.t !== 'ticket';
      const next = () => { commit(st, upd, i + 1, res === 'ok', bonus); if (bonus) bonusLap(st); else render(); };
      if (needRetype) {
        fb.innerHTML += `<p class="mut" style="text-align:center">Type it correctly to continue:</p><input class="ans" id="rt" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"><div class="row"><button class="btn" id="rtb">Continue</button></div>`;
        const go = () => { if (check($('#rt').value, { a: it.a, alt: it.alt }) !== 'bad') next(); else $('#rt').style.borderColor = 'var(--bad)'; };
        $('#rtb').onclick = go; $('#rt').onkeydown = e => { if (e.key === 'Enter') go(); }; $('#rt').focus();
      } else { fb.innerHTML += `<div class="row"><button class="btn" id="nx">Next →</button></div>`; $('#nx').onclick = next; }
    };
    if (it.t === 'choose') app.querySelectorAll('.opts button').forEach(b => b.onclick = () => { if (lock) return; const ok = b.dataset.o === it.a; b.classList.add(ok ? 'ok' : 'bad'); if (!ok) app.querySelector(`.opts button[data-o="${CSS.escape(it.a)}"]`).classList.add('ok'); finish(ok ? 'ok' : 'bad'); });
    if (it.t === 'type') { const go = () => { const v = $('#ans').value; if (!v.trim() || lock) return; finish(check(v, it), v); }; $('#go').onclick = go; $('#ans').onkeydown = e => { if (e.key === 'Enter') go(); }; setTimeout(() => $('#ans') && $('#ans').focus(), 50); }
    if (it.t === 'tiles') {
      let built = []; const upd = () => { $('#built').textContent = built.map(k => app.querySelector(`.tiles button[data-k="${k}"]`).textContent).join(''); };
      app.querySelectorAll('.tiles button').forEach(b => b.onclick = () => { if (lock) return; built.push(b.dataset.k); b.classList.add('used'); upd(); });
      $('#del').onclick = () => { if (lock || !built.length) return; const k = built.pop(); app.querySelector(`.tiles button[data-k="${k}"]`).classList.remove('used'); upd(); };
      $('#go').onclick = () => { if (lock || !built.length) return; const v = $('#built').textContent; finish(check(v.toLowerCase(), { a: it.a.toLowerCase(), alt: (it.alt || []).map(x => x.toLowerCase()) }), v); };
    }
    if (it.t === 'ticket') {
      $('#go').onclick = () => {
        if (lock) return; const ins = [...app.querySelectorAll('.titem input')]; if (ins.some(x => !x.value.trim())) return;
        let all = true; ins.forEach((x, k) => { const r = check(x.value, it.its[k]); x.classList.add(r === 'bad' ? 'bad' : 'ok'); if (r === 'bad') { all = false; x.value += '  →  ' + it.its[k].a; } x.disabled = true; });
        finish(all ? 'ok' : 'bad');
      };
    }
    if (it.t === 'fix') {
      app.querySelectorAll('.words button').forEach(b => b.onclick = () => {
        if (lock) return; app.querySelectorAll('.words button').forEach(x => x.classList.remove('sel')); b.classList.add('sel');
        const w = b.textContent.replace(/[.,!?]/g, '');
        if (w === it.w) { $('#fixin').style.display = 'block'; $('#ans').focus(); }
        else { $('#fb').innerHTML = `<div class="fb half">"${esc(w)}" is correct. Look again! 👀</div>`; setTimeout(() => { if (!lock) $('#fb').innerHTML = ''; }, 1400); qStart -= 3000; }
      });
      const go = () => { const v = $('#ans').value; if (!v.trim() || lock) return; finish(check(v, it), v); };
      $('#go').onclick = go; $('#ans').onkeydown = e => { if (e.key === 'Enter') go(); };
    }
  }
  function stageDone(st, prog) {
    const n = STAGES[st].items.length, c = prog.c || 0, acc = c / n;
    // comeback badge
    const prev = st > 0 ? ((P().st || {})[st - 1]) : null;
    if (prev && prev.i && !(P().badges || {}).comeback) { const pa = (prev.c || 0) / STAGES[st - 1].items.length; if (pa < .7 && acc >= pa + .2) { setPath('players/' + me.id + '/badges/comeback', true); send('PATCH', 'players/' + me.id + '/badges', { comeback: true }); } }
    const r = ranking().findIndex(x => x.id === me.id) + 1;
    app.innerHTML = header() + `<div class="wrap"><div class="card wait"><div class="big">🏁</div><h2>${esc(STAGES[st].game)} – done!</h2><p class="mut">First-try correct: <b>${c} / ${n}</b></p><p class="mut">Your position</p><div class="rankme">#${r}</div>${badges()}
      <div class="row" style="margin-top:16px"><button class="btn or" id="bl">⭐ Bonus lap (+50 each)</button></div><p class="mut" style="margin-top:10px">Wait for the teacher to open the next stage.</p></div></div>`;
    $('#bl').onclick = () => bonusLap(st);
  }
  function bonusLap(st) {
    if (stageNow() !== st) return render();
    cur.bonus = true; cur.st = st;
    const done = (((P().st || {})[st]) || {}).b || 0, pool = shuffle(BONUS, me.id + 'bonus' + st);
    if (done >= pool.length) { cur.bonus = false; return waitScreen('Bonus lap complete! 🌟', 'Wait for the teacher to open the next stage.'); }
    question(st, [], 0, pool[done]);
  }
  /* --- showdown --- */
  function showdown() {
    const sd = (S.config.sd) || {}, it = STAGES[SHOW].items[sd.q];
    const key = sd.q + '-' + sd.state;
    if (sdShown === key) return updateHeaderOnly(); sdShown = key;
    if (sd.q === undefined || sd.state === 'ready') return waitScreen('🐝 Spelling Bee Showdown', 'Look at the TV. Get ready to listen and spell!');
    const mine = ((S.sd || {})[sd.q] || {})[me.id];
    if (sd.state === 'q' && !mine) {
      qStart = Date.now();
      app.innerHTML = header() + `<div class="wrap"><div class="card"><div class="lvl">Question ${sd.q + 1} / ${STAGES[SHOW].items.length}${it.dbl ? ' · DOUBLE POINTS' : ''}</div><h2>Listen and look at the TV 📺</h2>
        <input class="ans" id="ans" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="spell the word"><div class="row"><button class="btn" id="go">Send</button></div></div></div>`;
      const go = () => {
        const v = $('#ans').value; if (!v.trim()) return; const res = check(v, it);
        const el = (Date.now() - qStart) / 1000, sp = res === 'ok' ? Math.max(0, Math.round(30 - el * 1.5)) : 0;
        let pts = res === 'ok' ? 100 + sp : res === 'cap' ? 50 : 0; if (it.dbl) pts *= 2;
        setPath('sd/' + sd.q + '/' + me.id, { a: v, r: res, pts }); send('PUT', 'sd/' + sd.q + '/' + me.id, { a: v, r: res, pts });
        const upd = { score: (P().score || 0) + pts }; if (res !== 'ok') upd['miss/' + SHOW + '/' + it.a] = true;
        for (const k in upd) setPath('players/' + me.id + '/' + k, upd[k]); send('PATCH', 'players/' + me.id, upd);
        sdShown = null; showdown();
      };
      $('#go').onclick = go; $('#ans').onkeydown = e => { if (e.key === 'Enter') go(); }; $('#ans').focus();
      return;
    }
    if (sd.state === 'q') return waitScreen('Answer sent ✅', 'Wait for the answer on the TV.');
    if (sd.state === 'reveal') {
      const r = mine ? mine.r : 'none';
      app.innerHTML = header() + `<div class="wrap"><div class="card wait"><div class="big">${r === 'ok' ? '🎉' : r === 'cap' ? '🙂' : '📝'}</div><h2>${r === 'ok' ? 'Correct! +' + mine.pts : r === 'cap' ? 'Capital letter! +' + mine.pts : 'The answer is:'}</h2><div class="fb ${r === 'ok' ? 'ok' : 'bad'}"><div class="cw">${mine && r !== 'ok' ? diffHtml(mine.a, it.a) : esc(it.a)}</div></div></div></div>`;
    }
    if (sd.state === 'end') return waitScreen('🏆 The end!', 'Look at the TV for the podium.');
  }
}

/* ================= TV ================= */
function qrSvg(text, cell) { try { const q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({ cellSize: cell, margin: 2, scalable: true }); } catch (e) { return ''; } }
function initTV() {
  let lastSd = null, soundOn = false;
  listen(render); render();
  function render() {
    const st = stageNow(), r = ranking(), cfg = S.config || {};
    const joinUrl = BASE + '?sala=' + SALA;
    const pod = (n) => `<div class="podium">${r.slice(0, n).map((x, k) => `<div class="pod"><span class="m">${['🥇', '🥈', '🥉', '4', '5'][k]}</span>${esc(x.name)}<span class="s">${x.score}</span></div>`).join('') || '<p class="tvs">No players yet</p>'}</div>`;
    if (st < 0 || !STAGES[st]) {
      app.innerHTML = topBar(`<span class="pill">Room: ${esc(SALA)}</span>`) + `<div class="wrap tv"><p class="tvt">Spell It! ✏️</p><div style="display:flex;gap:34px;align-items:center;margin-top:10px"><div class="qrbox">${qrSvg(joinUrl, 8)}</div><div><p class="tvs" style="font-size:28px;margin:0 0 10px">Scan the QR code with your phone<br>and tap your name.</p><p class="join">${esc(joinUrl)}</p></div></div>
      <div style="margin-top:20px;font-size:26px">${names().map(n => `<span class="badge" style="font-size:20px">${players()[slug(n)] ? '✅' : '⏳'} ${esc(n)}</span>`).join(' ')}</div></div>`; return;
    }
    const s = STAGES[st];
    if (s.live) return tvShowdown(pod);
    const items = s.items.length;
    const rows = names().map(n => { const p = players()[slug(n)] || {}; const pr = ((p.st || {})[st] || {}).i || 0; return `<div class="prow"><span>${esc(n)}</span><div class="bar"><i style="width:${Math.min(1, pr / items) * 100}%"></i></div><span class="${pr >= items ? 'done' : ''}">${pr >= items ? '✓' : pr + '/' + items}</span></div>`; }).join('');
    app.innerHTML = topBar(`<span class="pill">Room: ${esc(SALA)}</span>`) + `<div class="wrap tv"><p class="tvs">${esc(s.title)}</p><p class="tvt">${esc(s.game)}</p><p class="tvs">${esc(s.sub)}</p>
      <div class="tvgrid" style="margin-top:20px"><div class="card">${rows}</div><div><h2 style="font-size:26px">Top 3</h2>${pod(3)}<div class="qrmini">${qrSvg(joinUrl, 4)}<span>Lost the game?<br>Scan to come back.</span></div></div></div></div>`;
  }
  function tvShowdown(pod) {
    const sd = (S.config.sd) || {}, items = STAGES[SHOW].items, it = items[sd.q];
    if (sd.state === 'end' || sd.q === undefined || sd.state === 'ready') {
      app.innerHTML = topBar(`<span class="pill">Room: ${esc(SALA)}</span>`) + `<div class="wrap tv" style="text-align:center"><p class="tvt">🐝 Spelling Bee Showdown</p>
        ${sd.state === 'end' ? `<p class="tvs">Final podium</p><div style="max-width:620px;margin:20px auto">${pod(5)}</div>` : `<p class="tvs">Listen and spell on your phone. The last 3 words are worth DOUBLE!</p>${soundOn ? '' : '<button class="btn sm" id="snd" style="margin-top:20px">🔊 Enable sound on this screen</button>'}`}</div>`;
      const b = $('#snd'); if (b) b.onclick = () => { soundOn = true; say('Ready'); render(); };
      return;
    }
    const ans = (S.sd || {})[sd.q] || {}, n = Object.keys(ans).length, tot = Object.keys(players()).length;
    if (sd.state === 'q' && lastSd !== sd.q + 'q') { lastSd = sd.q + 'q'; say(it.a); setTimeout(() => say(it.a), 2600); }
    const who = Object.entries(ans).filter(([, v]) => v.r === 'ok').map(([id]) => esc((players()[id] || {}).name || id));
    app.innerHTML = topBar(`<span class="pill">Question ${sd.q + 1} / ${items.length}${it.dbl ? ' · DOUBLE' : ''}</span>`) + `<div class="wrap tv"><div class="tvgrid"><div class="card sdq">
      ${it.p.emoji ? `<div class="emo">${it.p.emoji}</div>` : ''}${it.p.text ? `<div class="ptext">${esc(it.p.text)}</div>` : ''}
      ${sd.state === 'reveal' ? `<div class="fb ok" style="font-size:54px;margin-top:20px">${esc(it.a)}</div><p class="tvs">Correct: ${who.join(', ') || '—'}</p>` : `<p class="cnt">${n} / ${tot} answered</p><button class="btn sm sec" id="rep">🔊 Repeat</button>`}
      </div><div><h2 style="font-size:26px">Top 3</h2>${pod(3)}</div></div></div>`;
    const rp = $('#rep'); if (rp) rp.onclick = () => say(it.a);
  }
}

/* ================= TEACHER CONTROL ================= */
function initProf() {
  let editing = false;
  listen(render); render();
  function render() {
    if (editing) return;
    const cfg = S.config || {}, st = stageNow(), r = ranking();
    const studentUrl = BASE + '?sala=' + SALA, tvUrl = BASE + '?sala=' + SALA + '&tv=1';
    let missHtml = '';
    if (st >= 0) {
      const cnt = {}; Object.values(players()).forEach(p => Object.keys(((p.miss || {})[st]) || {}).forEach(k => cnt[k] = (cnt[k] || 0) + 1));
      const lookup = id => { for (const s of STAGES) for (const it of s.items) if (it.id === id) return it.a; return id; };
      const top5 = Object.entries(cnt).sort((a, b) => b[1] - a[1]).slice(0, 5);
      missHtml = top5.length ? top5.map(([k, v]) => `<span>${esc(lookup(k))} ×${v}</span>`).join('') : '<p class="mut">No mistakes yet.</p>';
    }
    const sd = cfg.sd || {}, items = STAGES[SHOW].items;
    app.innerHTML = topBar(`<span class="pill">Teacher · ${esc(SALA)}</span>`) + `<div class="wrap ctl">
     <div class="card"><h2>Links</h2><p class="mut">Students: <b>${esc(studentUrl)}</b></p><p class="mut">TV (open on the class screen): <b>${esc(tvUrl)}</b></p><p class="mut">Keep this control page on your phone so the TV never shows answers.</p></div>
     <div class="card"><h2>1 · Students</h2>${names().length ? `<p class="mut">${names().map(esc).join(' · ')}</p>` : '<p class="mut">Add the names before the class (first name + initial, one per line). For a pair on one phone, write "Ana & Bia".</p>'}
       <button class="btn sm sec" id="edit">${names().length ? 'Edit names' : 'Add names'}</button></div>
     <div class="card"><h2>2 · Stages</h2><p class="mut">Opening a stage closes the previous one for everybody (points are kept).</p><div class="sgrid">
       <button data-s="-1" class="${st < 0 ? 'cur' : ''}">Lobby</button>${STAGES.map((s, k) => `<button data-s="${k}" class="${st === k ? 'cur' : ''}">${k + 1}. ${esc(s.game)}</button>`).join('')}</div></div>
     ${st === SHOW ? `<div class="card"><h2>Showdown control</h2><p class="mut">${sd.q === undefined || sd.state === 'ready' ? 'Not started.' : sd.state === 'end' ? 'Finished.' : `Question ${sd.q + 1}/${items.length}: <b>${esc(items[sd.q].a)}</b> – ${sd.state === 'q' ? 'answering' : 'revealed'} (${Object.keys((S.sd || {})[sd.q] || {}).length} answers)`}</p>
       <div class="row">${sd.state === 'q' ? '<button class="btn" id="rev">Reveal answer</button>' : (sd.q === undefined || sd.state === 'ready') ? '<button class="btn" id="nq">Start: question 1</button>' : sd.state === 'end' ? '' : (sd.q + 1 < items.length ? '<button class="btn" id="nq">Next question</button>' : '<button class="btn or" id="end">Show podium</button>')}</div></div>` : ''}
     ${st >= 0 ? `<div class="card"><h2>Top 5 missed words (this stage)</h2><div class="miss">${missHtml}</div></div>` : ''}
     <div class="card"><h2>Ranking</h2><table class="pl"><tr><th>#</th><th>Name</th><th>Points</th><th>Stage progress</th><th></th></tr>
       ${r.map((x, k) => { const p = players()[x.id]; const pr = st >= 0 && !STAGES[st].live ? (((p.st || {})[st] || {}).i || 0) + '/' + STAGES[st].items.length : ''; return `<tr><td>${k + 1}</td><td>${esc(x.name)}${p.badges ? ' ' + (p.badges.streak ? '🔥' : '') + (p.badges.comeback ? '🚀' : '') : ''}</td><td>${x.score}</td><td>${pr}</td><td><button class="btn sm sec" data-pin="${x.id}">Reset PIN</button></td></tr>`; }).join('')}</table></div>
     <div class="card"><h2>Room</h2><button class="btn sm sec" id="reset">Delete all data in this room</button></div></div>`;
    $('#edit').onclick = () => editNames();
    app.querySelectorAll('.sgrid button').forEach(b => b.onclick = () => {
      const k = +b.dataset.s; if (k === st) return;
      confirmBox(k < 0 ? 'Go back to the lobby?' : `Open stage ${k + 1}: ${STAGES[k].game}?`, () => { const upd = { stage: k }; if (k === SHOW) upd.sd = { state: 'ready' }; setPath('config', upd, true); send('PATCH', 'config', upd); render(); });
    });
    app.querySelectorAll('[data-pin]').forEach(b => b.onclick = () => confirmBox(`Reset the PIN of ${esc(players()[b.dataset.pin].name)}? Points are kept.`, () => { setPath('players/' + b.dataset.pin + '/pin', null); send('DELETE', 'players/' + b.dataset.pin + '/pin'); render(); }));
    const setSd = v => { setPath('config/sd', v); send('PUT', 'config/sd', v); render(); };
    if ($('#nq')) $('#nq').onclick = () => setSd({ q: sd.q === undefined || sd.state === 'ready' ? 0 : sd.q + 1, state: 'q' });
    if ($('#rev')) $('#rev').onclick = () => setSd({ q: sd.q, state: 'reveal' });
    if ($('#end')) $('#end').onclick = () => setSd({ q: sd.q, state: 'end' });
    $('#reset').onclick = () => confirmBox('Delete ALL data in this room (names, points, answers)? This cannot be undone.', () => { S = {}; send('DELETE', ''); render(); });
  }
  function editNames() {
    editing = true;
    app.innerHTML = topBar() + `<div class="wrap ctl"><div class="card"><h2>Students (one per line)</h2><textarea id="ta">${names().map(esc).join('\n')}</textarea>
      <div class="row"><button class="btn sec" id="cx">Cancel</button><button class="btn" id="sv">Save</button></div></div></div>`;
    $('#cx').onclick = () => { editing = false; render(); };
    $('#sv').onclick = () => {
      const list = [...new Set($('#ta').value.split('\n').map(x => x.trim()).filter(Boolean))].slice(0, 20);
      const obj = {}; list.forEach((n, k) => obj['n' + k] = n);
      const cfg = { names: obj }; if (typeof (S.config || {}).stage !== 'number') cfg.stage = -1;
      setPath('config/names', obj); if (cfg.stage !== undefined) setPath('config/stage', -1);
      send('PATCH', 'config', cfg); editing = false; render();
    };
  }
}
</script>
</body>
</html>
