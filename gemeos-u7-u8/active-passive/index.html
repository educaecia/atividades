<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Active & Passive Voice – Interactive</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --p:#583F84; --p2:#7A62A8; --l:#EFE9F8; --l2:#F7F4FC; --ink:#2B2540; --mut:#6E6787;
  --ok:#2F8F6B; --okl:#E5F4EE; --bad:#C9483E; --badl:#FBE7E4; --o:#C9622E; --ol:#FBEDE4; --y:#FFF6D9;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',system-ui,sans-serif;color:var(--ink);background:#FBFAFE;font-size:16px;line-height:1.5}
header{background:#fff;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px rgba(88,63,132,.07)}
.hwrap{max-width:980px;margin:0 auto;padding:10px 18px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px}
.logo img{height:44px}
.logo span{font-size:12px;color:var(--mut);border-left:2px solid var(--l);padding-left:12px;line-height:1.25}
.title{font-weight:700;color:var(--p);font-size:15px}
.strip{height:4px;background:linear-gradient(90deg,#F0827F 0 20%,#F9D86B 20% 40%,#63BF75 40% 60%,#88D8E6 60% 80%,#583F84 80% 100%);margin-top:10px}
nav{max-width:980px;margin:0 auto;padding:10px 18px;display:flex;gap:6px;overflow-x:auto}
nav button{flex:none;border:1.5px solid var(--l);background:#fff;color:var(--p);border-radius:20px;padding:5px 13px;font:600 13px Poppins,sans-serif;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--p);color:#fff;border-color:var(--p)}
nav button .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--l);margin-left:6px;vertical-align:middle}
nav button .dot.done{background:#63BF75}
main{max-width:980px;margin:0 auto;padding:18px 18px 80px}
.part-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.part-h b{background:var(--l);color:var(--p);border-radius:10px;padding:2px 10px;font-size:12px;letter-spacing:.6px;text-transform:uppercase}
.part-h h1{font-size:24px;color:var(--p)}
details.explain{background:var(--l2);border:1.5px solid var(--l);border-left:5px solid var(--p2);border-radius:14px;padding:10px 16px;margin-bottom:18px}
details.explain summary{cursor:pointer;font-weight:600;color:var(--p2);font-size:14px}
details.explain .in{margin-top:8px;font-size:15px}
details.explain p{margin-bottom:6px}
.hl{color:var(--p);font-weight:700}
.warn{color:var(--o);font-weight:600}
.card{background:#fff;border:1.5px solid var(--l);border-radius:18px;padding:18px 20px;margin-bottom:18px;box-shadow:0 2px 8px rgba(88,63,132,.04)}
.step-h{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.num{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.step-h h2{font-size:18px;color:var(--p)}
.time{margin-left:auto;font-size:12px;font-weight:600;color:var(--p2);background:var(--l);border-radius:10px;padding:1px 9px}
.inst{color:var(--mut);font-size:14.5px;margin-bottom:12px}
.chip{display:inline-block;background:var(--l);color:var(--ink);border-radius:14px;padding:5px 12px;margin:4px;font-size:14.5px;cursor:pointer;border:2px solid transparent;user-select:none}
.chip.sel{border-color:var(--p);background:#fff}
.chip.ok{background:var(--okl);border-color:var(--ok)}
.chip.bad{background:var(--badl);border-color:var(--bad)}
.pool{min-height:54px;border:2px dashed var(--p2);border-radius:14px;padding:6px;margin-bottom:12px;text-align:center}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.col{border:1.5px solid var(--l);border-radius:14px;min-height:150px;cursor:pointer;background:var(--l2)}
.col h3{background:var(--p);color:#fff;font-size:14px;padding:6px 12px;border-radius:12px 12px 0 0}
.col .drop{padding:6px}
.col.hint{outline:3px solid #F9D86B}
ol.items{list-style:none;counter-reset:i}
ol.items>li{counter-increment:i;padding:9px 0;border-bottom:1px solid var(--l);display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
ol.items>li:last-child{border-bottom:0}
ol.items>li:before{content:counter(i);font-weight:700;color:var(--p);min-width:20px}
ol.items.roman>li:before{content:counter(i,lower-roman)}
.q{flex:1;min-width:240px}
select,input[type=text]{font:15px Poppins,sans-serif;border:2px solid var(--l);border-radius:10px;padding:4px 8px;color:var(--ink);background:#fff}
select:focus,input:focus{outline:none;border-color:var(--p2)}
input[type=text]{width:170px}
.ok-f{border-color:var(--ok)!important;background:var(--okl)!important}
.bad-f{border-color:var(--bad)!important;background:var(--badl)!important}
.fb{width:100%;font-size:13.5px;margin-left:30px}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.opt{border:2px solid var(--l);background:#fff;border-radius:10px;padding:3px 12px;font:600 14px Poppins,sans-serif;color:var(--p);cursor:pointer;margin-right:4px}
.opt.sel{background:var(--p);color:#fff;border-color:var(--p)}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.word{display:inline-block;padding:2px 4px;margin:1px 0;border-radius:7px;cursor:pointer;border-bottom:2px dotted #cfc5e6}
.word:hover{background:var(--l)}
.word.sel{background:#FCE3D3;border-bottom-color:var(--o)}
.word.ok{background:var(--okl)} .word.bad{background:var(--badl)}
.comma{color:var(--o);font-weight:700;font-size:20px;line-height:0}
.text{font-size:16px;line-height:2.15;background:var(--l2);border-radius:14px;padding:12px 16px}
.inl{display:inline-flex;gap:3px;vertical-align:middle;flex-wrap:wrap}
.inl .opt{font-size:13.5px;padding:1px 9px}
.inl .n{font-weight:700;color:var(--p);margin-right:2px}
.bar{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.btn{background:var(--p);color:#fff;border:0;border-radius:24px;padding:9px 22px;font:600 15px Poppins,sans-serif;cursor:pointer}
.btn.sec{background:#fff;color:var(--p);border:2px solid var(--l)}
.score{font-weight:600;color:var(--p);font-size:15px}
.navbtns{display:flex;justify-content:space-between;margin-top:6px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.letters{background:var(--l2);border-radius:14px;padding:10px 14px;line-height:2}
.res-row{display:grid;grid-template-columns:180px 1fr 70px;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--l)}
.track{height:12px;background:var(--l);border-radius:8px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,var(--p2),var(--p));border-radius:8px}
.wrong{font-size:14px;color:var(--mut);margin-top:4px}
.tip{background:var(--y);border-radius:12px;padding:10px 14px;font-size:14.5px;margin-top:10px}
.big{font-size:40px;font-weight:700;color:var(--p)}
@media(max-width:640px){.cols3{grid-template-columns:1fr}.match{grid-template-columns:1fr}.res-row{grid-template-columns:1fr 60px}.res-row .track{grid-column:1/3;order:3}.logo span{display:none}}
.ptab{width:100%;border-collapse:collapse;font-size:15px}.ptab th{background:var(--p);color:#fff;text-align:left;padding:6px 10px;font-weight:600}.ptab td{padding:5px 8px;border-bottom:1px solid var(--l)}.ptab input{width:100%;max-width:200px}
</style>
</head>

<script>

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const el=(t,a={},...kids)=>{const e=document.createElement(t);for(const k in a){if(k==='class')e.className=a[k];else if(k==='html')e.innerHTML=a[k];else if(k.startsWith('on'))e.addEventListener(k.slice(2),a[k]);else e.setAttribute(k,a[k]);}kids.flat().forEach(c=>e.append(c instanceof Node?c:document.createTextNode(c)));return e;};
const norm=s=>(s||'').toLowerCase().replace(/[’']/g,"'").replace(/[.,!?]/g,'').replace(/\s+/g,' ').trim();
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a;};

/* ---------- state: first-try and latest results per step ---------- */
const R={first:{},last:{}};
function record(id,label,res){ if(!R.first[id])R.first[id]={label,...res}; R.last[id]={label,...res}; updateNav(); }
function scoreBar(card,res){ let s=$('.score',card); s.textContent=`${res.score} / ${res.total} correct`+(res.score===res.total?' — excellent!':' — fix the red ones and check again.'); }


/* normalisation: also treat hyphens as spaces */
const nrm=s=>norm((s||'').replace(/-/g,' '));

/* shared: header, check bar with "Show answers" after first try */
function head(card,n,title,time,inst){card.append(el('div',{class:'step-h'},el('div',{class:'num'},n),el('h2',{},title),el('span',{class:'time'},time)),el('p',{class:'inst',html:inst}));}
function bar(card,check,reveal){
  const show=el('button',{class:'btn sec',style:'display:none',onclick:()=>{reveal();show.style.display='none';}},'Show answers');
  const c=()=>{check();if(reveal)show.style.display='';};
  card.append(el('div',{class:'bar'},el('button',{class:'btn',onclick:c},'Check'),show,el('span',{class:'score'})));
  card._check=check;
}
const done=(card,id,label,sc,total,wrong)=>{const res={score:sc,total,wrong};record(id,label,res);scoreBar(card,res);};

/* ---------- STEP 1: A/P + who ---------- */
const WHO=['David Mach','Yong Ho Ji','many people','a Scottish artist','not mentioned'];
const S1=[
 {q:'David Mach makes sculptures from coat hangers.',v:'A',w:['David Mach']},
 {q:'Glass is melted down and reused.',v:'P',w:['not mentioned']},
 {q:'The Giants were made by David Mach in 2012.',v:'P',w:['David Mach']},
 {q:'Yong Ho Ji chooses real and imagined creatures.',v:'A',w:['Yong Ho Ji']},
 {q:'Bottles and windows are made from glass.',v:'P',w:['not mentioned']},
 {q:'Many people throw plastic in the sea.',v:'A',w:['many people']},
 {q:'The train was made out of bricks by a Scottish artist.',v:'P',w:['a Scottish artist']},
 {q:'Rubbish is collected every Monday in my street.',v:'P',w:['not mentioned']}];
function step1(){
  const card=el('div',{class:'card'});
  head(card,'1','Active or passive?','4 min','Tap <b>A</b> (active) or <b>P</b> (passive). Then choose <b>who does the action</b>. If the sentence doesn\'t say, choose <i>not mentioned</i>.');
  const ol=el('ol',{class:'items'});const ctr=[];
  S1.forEach(it=>{const st={v:null,bs:[]};const box=el('span',{class:'inl'});
    ['A','P'].forEach(o=>{const b=el('button',{class:'opt',onclick:()=>{st.v=o;st.bs.forEach(x=>x.className='opt'+(x===b?' sel':''));}},o);st.bs.push(b);box.append(b);});
    const s=el('select',{},el('option',{value:''},'who does it?'),WHO.map(w=>el('option',{value:w},w)));
    const fb=el('div',{class:'fb'});
    ol.append(el('li',{},el('div',{class:'q'},el('div',{style:'margin-bottom:5px'},it.q),box,' ',s),fb));ctr.push({st,s,it,fb});});
  card.append(ol);
  const check=()=>{let sc=0,wrong=[];ctr.forEach(({st,s,it,fb},i)=>{const okV=st.v===it.v,okW=it.w.includes(s.value);
      st.bs.forEach(x=>{x.className='opt';if(x.textContent===st.v)x.classList.add(okV?'ok':'bad');});
      s.classList.remove('ok-f','bad-f');s.classList.add(okW?'ok-f':'bad-f');
      sc+=okV+okW;const m=[];
      if(!okV)m.push(st.v?(it.v==='P'?'Look for be + past participle → passive.':'The subject does the action → active.'):'Choose A or P.');
      if(!okW)m.push(s.value?(it.w[0]==='not mentioned'?'Is there “by…”? If not, the doer is not mentioned.':(it.v==='P'?'In the passive, the doer comes after “by”.':'In the active, the doer is the subject.')):'Choose who does it.');
      fb.className='fb '+(m.length?'bad':'ok');fb.textContent=m.join(' ');if(m.length)wrong.push(`${i+1}. ${it.q} → ${st.v||'—'} / ${s.value||'—'}`);});
    done(card,'s1','Step 1 · Active or passive?',sc,16,wrong);};
  const reveal=()=>ctr.forEach(({st,s,it})=>{st.v=it.v;st.bs.forEach(x=>x.className='opt'+(x.textContent===it.v?' ok':''));s.value=it.w[0];s.classList.add('ok-f');});
  bar(card,check,reveal);card._solve=reveal;
  return card;
}

/* ---------- STEP 2: participles ---------- */
const S2=[['build','built','built'],['find','found','found'],['throw','threw','thrown'],['sell','sold','sold'],['see','saw','seen'],['steal','stole','stolen'],['write','wrote','written'],['speak','spoke','spoken'],['grow','grew','grown'],['eat','ate','eaten'],['take','took','taken']];
function step2(){
  const card=el('div',{class:'card'});
  head(card,'2','Know your participles','4 min','Type the <b>past simple</b> and the <b>past participle</b>. Example: make → made → made.');
  const t=el('table',{class:'ptab'});t.append(el('tr',{},el('th',{},'Base form'),el('th',{},'Past simple'),el('th',{},'Past participle')));
  const ctr=[];
  S2.forEach(r=>{const a=el('input',{type:'text',autocomplete:'off',spellcheck:'false'}),b=el('input',{type:'text',autocomplete:'off',spellcheck:'false'});
    t.append(el('tr',{},el('td',{},el('b',{},r[0])),el('td',{},a),el('td',{},b)));ctr.push({a,b,r});});
  card.append(t);
  const check=()=>{let sc=0,wrong=[];ctr.forEach(({a,b,r})=>{[[a,r[1]],[b,r[2]]].forEach(([inp,ans],k)=>{inp.classList.remove('ok-f','bad-f');
      if(nrm(inp.value)===ans){sc++;inp.classList.add('ok-f');}else{inp.classList.add('bad-f');wrong.push(`${r[0]} (${k?'participle':'past'}) → ${inp.value||'—'}`);}});});
    done(card,'s2','Step 2 · Participles',sc,22,wrong);};
  const reveal=()=>ctr.forEach(({a,b,r})=>{a.value=r[1];b.value=r[2];a.className=b.className='ok-f';});
  bar(card,check,reveal);card._solve=reveal;
  return card;
}

/* ---------- typed gap step (Steps 3 and 6) ---------- */
function gapStep({id,n,title,time,inst,items,label,hint,wide}){
  const card=el('div',{class:'card'});head(card,n,title,time,inst);
  const ol=el('ol',{class:'items'});const ctr=[];
  items.forEach(it=>{const inp=el('input',{type:'text',autocomplete:'off',spellcheck:'false',style:wide?'width:210px':''});const fb=el('div',{class:'fb'});
    ol.append(el('li',{},el('div',{class:'q',html:''},it.pre+' ',inp,' '+it.post+' ',el('span',{style:'color:var(--mut)'},it.v||'')),fb));ctr.push({inp,fb,it});});
  card.append(ol);
  const check=()=>{let sc=0,wrong=[];ctr.forEach(({inp,fb,it},i)=>{inp.classList.remove('ok-f','bad-f');
      if(it.a.includes(nrm(inp.value))){sc++;inp.classList.add('ok-f');fb.className='fb ok';fb.textContent='';}
      else{inp.classList.add('bad-f');fb.className='fb bad';fb.textContent=nrm(inp.value)?hint(it,inp.value):'Write your answer.';wrong.push(`${i+1}. ${it.pre} ___ ${it.v||''} → “${inp.value||'—'}”`);}});
    done(card,id,label,sc,ctr.length,wrong);};
  const reveal=()=>ctr.forEach(({inp,it})=>{inp.value=it.a[0];inp.className='ok-f';});
  bar(card,check,reveal);card._solve=reveal;
  return card;
}
const PPS={speak:'spoken',grow:'grown',paint:'painted',finish:'finished',make:'made',recycle:'recycled',use:'used',eat:'eaten',take:'taken',sort:'sorted',mix:'mixed',clean:'cleaned'};
function hint3(it,v){const w=nrm(v).split(' ');const [be,pp]=it.a[0].split(' ');
  const BE=['is','are','was','were','am'];const ub=w.find(x=>BE.includes(x));
  if(!ub)return'Passive needs “be”: is / are / was / were + past participle.';
  const past=['was','were'];
  if(past.includes(be)!==past.includes(ub))return past.includes(be)?'Check the tense: look for the time word (a date, “in 2012”…) → past.':'Check the tense: this is a general fact or routine → present.';
  if(ub!==be)return'Singular or plural? Check the subject.';
  if(!w.includes(pp)){const base=it.v.replace(/[()]/g,'').trim();return w.includes(base)?`Use the past participle: ${base} → ?`:'Check the past participle.';}
  return'Almost — check the word order.';}

function hint4(it,v){const n=nrm(v),w=n.split(' ');
  if(it.dir==='P'){
    if(/by (people|someone|somebody)/.test(n))return'Do we need “by people / by someone”? We usually leave it out.';
    if(!w.some(x=>['is','are','was','were'].includes(x)))return'Passive = be + past participle.';
    const exp=it.a[0].split(' ').find(x=>['is','are','was','were'].includes(x));
    if(['was','were'].includes(exp)&&w.some(x=>['is','are'].includes(x)))return'The active verb is in the past → was / were.';
    if(['is','are'].includes(exp)&&w.some(x=>['was','were'].includes(x)))return'The active verb is in the present → is / are.';
    if(it.need&&!w.includes('by'))return'Here the doer is important — add “by…”.';
    return'Almost! Start with the object of the active sentence and check spelling.';}
  if(w.some(x=>['is','was'].includes(x))&&w.includes('by'))return'Active: start with the doer (the words after “by”) and use a normal verb.';
  if(it.q.includes('every')&&!w.includes('collects'))return'Present simple, he/she/it → collects.';
  return'Almost! Start with the doer and check the verb tense.';}

    ol.append(el('li',{},el('div',{class:'q'},el('span',{class:'chip',style:'cursor:default;font-size:12px;padding:1px 8px;margin:0 6px 0 0'},it.dir==='P'?'→ passive':'→ active'),it.q,inp),fb));ctr.push({inp,fb,it});});
  card.append(ol);
  const check=()=>{let sc=0,wrong=[];ctr.forEach(({inp,fb,it},i)=>{inp.classList.remove('ok-f','bad-f');

  window.addEventListener('hashchange',()=>{const k=PARTS.findIndex(p=>p.id===location.hash.slice(1));if(k>=0&&k!==current)show(k);});})();

</script>
