<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Units 7 &amp; 8 – Twins Exam Review</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --p:#583F84; --p2:#7A62A8; --l:#EFE9F8; --l2:#F7F4FC; --ink:#2B2540; --mut:#6E6787;
  --ok:#2F8F6B; --okl:#E5F4EE; --bad:#C9483E; --badl:#FBE7E4; --o:#C9622E; --y:#FFF6D9;
  --a:#D9534F; --al:#FCE6E5; --b:#2391AD; --bl:#DFF2F7;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',system-ui,sans-serif;color:var(--ink);background:#FBFAFE;font-size:16px;line-height:1.5}
header{background:#fff;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px rgba(88,63,132,.07)}
.hwrap{max-width:1000px;margin:0 auto;padding:10px 18px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px}
.logo img{height:44px}
.logo span{font-size:12px;color:var(--mut);border-left:2px solid var(--l);padding-left:12px;line-height:1.25}
.title{font-weight:700;color:var(--p);font-size:15px;text-align:right}
.title small{display:block;font-weight:500;color:var(--mut);font-size:12px}
.strip{height:4px;background:linear-gradient(90deg,#F0827F 0 20%,#F9D86B 20% 40%,#63BF75 40% 60%,#88D8E6 60% 80%,#583F84 80% 100%);margin-top:10px}
nav{max-width:1000px;margin:0 auto;padding:10px 18px;display:flex;gap:6px;overflow-x:auto}
nav button{flex:none;border:1.5px solid var(--l);background:#fff;color:var(--p);border-radius:20px;padding:5px 12px;font:600 13px Poppins,sans-serif;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--p);color:#fff;border-color:var(--p)}
nav button .u{font-size:11px;opacity:.75;margin-right:3px}
nav button .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--l);margin-left:6px;vertical-align:middle}
nav button .dot.done{background:#63BF75}
main{max-width:1000px;margin:0 auto;padding:18px 18px 80px}
.part-h{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.part-h b{background:var(--l);color:var(--p);border-radius:10px;padding:2px 10px;font-size:12px;letter-spacing:.6px;text-transform:uppercase}
.part-h h1{font-size:24px;color:var(--p)}
details.explain{background:var(--l2);border:1.5px solid var(--l);border-left:5px solid var(--p2);border-radius:14px;padding:10px 16px;margin-bottom:18px}
details.explain summary{cursor:pointer;font-weight:600;color:var(--p2);font-size:14px}
details.explain .in{margin-top:8px;font-size:15px}
details.explain p{margin-bottom:7px}
.hl{color:var(--p);font-weight:700}
.warn{color:var(--o);font-weight:600}
.formula{display:inline-block;background:#fff;border:1.5px solid var(--l);border-radius:10px;padding:3px 10px;margin:2px 0;font-weight:600;color:var(--p)}
.card{background:#fff;border:1.5px solid var(--l);border-radius:18px;padding:18px 20px;margin-bottom:18px;box-shadow:0 2px 8px rgba(88,63,132,.04)}
.step-h{display:flex;align-items:center;gap:10px;margin-bottom:4px;flex-wrap:wrap}
.num{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;font-size:14px}
.step-h h2{font-size:18px;color:var(--p)}
.mode{font-size:11.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;border-radius:10px;padding:2px 9px}
.mode.turns{background:#FFF0D6;color:#A86412}
.mode.blind{background:#2B2540;color:#fff}
.mode.team{background:#E3F4E8;color:#2F7A45}
.mode.speed{background:#FCE3D3;color:#B34E1C}
.mode.book{background:var(--l);color:var(--p)}
.time{margin-left:auto;font-size:12px;font-weight:600;color:var(--p2);background:var(--l);border-radius:10px;padding:1px 9px}
.inst{color:var(--mut);font-size:14.5px;margin-bottom:12px}
.nm{display:inline-block;border-radius:10px;padding:0 9px;font-size:12.5px;font-weight:700;color:#fff;white-space:nowrap}
.nm.p0{background:var(--a)} .nm.p1{background:var(--b)} .nm.tm{background:var(--p)}
ol.items{list-style:none;counter-reset:i}
ol.items>li{counter-increment:i;padding:9px 0 9px 8px;border-bottom:1px solid var(--l);display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;border-left:4px solid transparent}
ol.items>li.o0{border-left-color:var(--a)} ol.items>li.o1{border-left-color:var(--b)}
ol.items>li:last-child{border-bottom:0}
ol.items>li:before{content:counter(i);font-weight:700;color:var(--p);min-width:18px}
.q{flex:1;min-width:240px}
.q .who{margin-right:6px}
.q .sub{display:block;color:var(--mut);font-size:14px}
select,input[type=text]{font:15px Poppins,sans-serif;border:2px solid var(--l);border-radius:10px;padding:4px 8px;color:var(--ink);background:#fff}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--p2)}
input.g{width:190px}
input.w{width:100%;max-width:560px;margin-top:5px}
.hint{color:var(--p2);font-weight:600;font-size:14px}
.ok-f{border-color:var(--ok)!important;background:var(--okl)!important}
.bad-f{border-color:var(--bad)!important;background:var(--badl)!important}
.fb{width:100%;font-size:13.5px;margin-left:30px}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.opt{border:2px solid var(--l);background:#fff;border-radius:10px;padding:3px 12px;font:600 14px Poppins,sans-serif;color:var(--p);cursor:pointer;margin:3px 4px 3px 0}
.opt.sel{background:var(--p);color:#fff;border-color:var(--p)}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.right{border-color:var(--ok);color:var(--ok)}
.bar{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.btn{background:var(--p);color:#fff;border:0;border-radius:24px;padding:9px 22px;font:600 15px Poppins,sans-serif;cursor:pointer}
.btn.sec{background:#fff;color:var(--p);border:2px solid var(--l)}
.btn.a{background:var(--a)} .btn.b{background:var(--b)}
.btn:disabled{opacity:.45;cursor:default}
.score{font-weight:600;color:var(--p);font-size:15px}
.navbtns{display:flex;justify-content:space-between;margin-top:6px}
.tip{background:var(--y);border-radius:12px;padding:10px 14px;font-size:14.5px;margin-top:10px}
.text{font-size:16px;line-height:1.85;background:var(--l2);border-radius:14px;padding:14px 18px;margin-bottom:14px}
.text p{margin-bottom:10px}
.text p:last-child{margin-bottom:0}
.text h3{color:var(--p);font-size:18px;margin-bottom:6px}
.text select{padding:1px 4px;font-size:14.5px}
.text .n{font-weight:700;color:var(--p);font-size:13px}
/* blind */
.blind-box{border-radius:16px;padding:16px;background:var(--l2)}
.turnban{border-radius:12px;padding:10px 14px;font-weight:600;color:#fff;margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.turnban.p0{background:var(--a)} .turnban.p1{background:var(--b)} .turnban.rev{background:var(--p)}
.turnban .look{font-weight:500;font-size:14px;opacity:.95}
.bq{font-size:18px;font-weight:600;margin-bottom:10px}
.bopts{display:flex;flex-direction:column;gap:8px}
.bopt{text-align:left;border:2px solid var(--l);background:#fff;border-radius:12px;padding:10px 14px;font:500 16px Poppins,sans-serif;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:8px}
.bopt:hover{border-color:var(--p2)}
.bopt.right{border-color:var(--ok);background:var(--okl)}
.bopt.wrongc{border-color:var(--bad);background:var(--badl)}
.bopt .tags{margin-left:auto;display:flex;gap:4px}
.prog{font-size:13px;color:var(--mut);margin-bottom:6px}
.pts{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-weight:600}
/* speed */
.speed{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sp{border-radius:16px;padding:14px;border:2px solid var(--l);text-align:center}
.sp.p0{border-color:var(--al)} .sp.p1{border-color:var(--bl)}
.sp .big{font-size:36px;font-weight:700}
.sp.p0 .big{color:var(--a)} .sp.p1 .big{color:var(--b)}
.arena{grid-column:1/3;border-radius:16px;padding:16px;background:var(--l2);display:none}
.arena .clock{font-size:28px;font-weight:700;color:var(--p);float:right}
.arena .def{font-size:19px;font-weight:600;margin:6px 0 14px;min-height:56px}
.arena .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.arena .grid button{border:2px solid var(--l);background:#fff;border-radius:12px;padding:12px;font:600 17px Poppins,sans-serif;color:var(--p);cursor:pointer}
.arena .grid button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.arena .grid button.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.missed{font-size:13.5px;color:var(--mut);margin-top:6px}
/* sort & unscramble */
.chip{display:inline-block;background:var(--l);color:var(--ink);border-radius:14px;padding:5px 12px;margin:4px;font-size:14.5px;cursor:pointer;border:2px solid transparent;user-select:none}
.chip.sel{border-color:var(--p);background:#fff}
.chip.ok{background:var(--okl);border-color:var(--ok)}
.chip.bad{background:var(--badl);border-color:var(--bad)}
.pool{min-height:54px;border:2px dashed var(--p2);border-radius:14px;padding:6px;margin-bottom:12px;text-align:center}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.col{border:1.5px solid var(--l);border-radius:14px;min-height:140px;cursor:pointer;background:var(--l2)}
.col h3{background:var(--p);color:#fff;font-size:14px;padding:6px 12px;border-radius:12px 12px 0 0}
.col .drop{padding:6px}
.unsc{padding:8px 0;border-bottom:1px solid var(--l)}
.unsc .built{min-height:42px;border-bottom:2px solid var(--p2);margin:4px 0 6px;padding:2px 0}
.unsc .built .chip{background:#fff;border-color:var(--p2)}
.vgrp{font-weight:700;color:var(--p2);font-size:13px;letter-spacing:.6px;text-transform:uppercase;margin:14px 0 8px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px}
.vc{position:relative;border:1.5px solid var(--l);border-radius:16px;padding:12px 12px 10px;background:#fff;cursor:pointer;text-align:center;transition:transform .15s;min-height:190px;display:flex;flex-direction:column;align-items:center}
.vc:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(88,63,132,.1)}
.vc .pic{height:70px;display:flex;align-items:center;justify-content:center;font-size:50px;line-height:1;margin-bottom:6px}
.vc .pic svg{height:64px;width:auto}
.vc .wd{font-weight:700;color:var(--p);font-size:18px;line-height:1.2}
.vc .ps{font-size:11.5px;color:var(--mut)}
.vc .ex{font-size:13.5px;margin-top:6px;color:var(--ink)}
.vc .pt{display:none;margin-top:auto;background:var(--y);border-radius:10px;padding:3px 10px;font-weight:600;font-size:14px}
.vc.flip .pt{display:block}
.vc .tap{margin-top:auto;font-size:11.5px;color:var(--p2)}
.vc.flip .tap{display:none}
.vc .say{position:absolute;top:8px;right:8px;border:0;background:var(--l);color:var(--p);border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:15px}
.mode.pres{background:var(--l);color:var(--p)}
/* notebook */
.nb{background:repeating-linear-gradient(#fff 0 31px,#E4DDF2 31px 32px);border:1.5px solid var(--l);border-left:6px solid #F0827F;border-radius:14px;padding:14px 18px}
.nb h3{color:var(--p);margin-bottom:4px}
.checks{display:grid;grid-template-columns:1fr 60px 60px;gap:4px 8px;align-items:center;margin-top:8px;font-size:14.5px}
.checks .hd{font-weight:700;text-align:center}
.checks input{width:20px;height:20px;justify-self:center;accent-color:var(--p)}
.model{background:#fff;border:1.5px dashed var(--p2);border-radius:12px;padding:10px 14px;margin-top:12px;font-size:15px}
/* start */
.names{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:12px 0}
.names label{font-weight:600;font-size:14px}
.names input{width:100%;margin-top:4px;font-size:18px;padding:8px 12px}
.names .p0 input{border-color:var(--al)} .names .p1 input{border-color:var(--bl)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.modes div{border:1.5px solid var(--l);border-radius:14px;padding:12px 14px;font-size:14.5px}
.modes div .mode{display:inline-block;margin-bottom:5px}
/* results */
table.res{width:100%;border-collapse:collapse;font-size:14.5px}
table.res th{background:var(--p);color:#fff;text-align:left;padding:7px 10px;font-weight:600}
table.res td{padding:7px 10px;border-bottom:1px solid var(--l);vertical-align:top}
table.res td.c{text-align:center;font-weight:600;white-space:nowrap}
table.res tr.tot td{font-weight:700;background:var(--l2)}
.wrong{font-size:12.5px;color:var(--mut);font-weight:400}
.bigs{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.bigs div{flex:1;min-width:150px;border-radius:14px;padding:12px 14px;color:#fff}
.bigs .p0{background:var(--a)} .bigs .p1{background:var(--b)} .bigs .tm{background:var(--p)}
.bigs b{display:block;font-size:30px;line-height:1.1}
@media(max-width:680px){.cols3,.speed,.names,.modes{grid-template-columns:1fr}.arena{grid-column:1}.logo span{display:none}.title{display:none}}
</style>
</head>

<script>
/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const el=(t,a={},...kids)=>{const e=document.createElement(t);for(const k in a){if(k==='class')e.className=a[k];else if(k==='html')e.innerHTML=a[k];else if(k.startsWith('on'))e.addEventListener(k.slice(2),a[k]);else e.setAttribute(k,a[k]);}kids.flat().forEach(c=>{if(c!=null)e.append(c instanceof Node?c:document.createTextNode(c))});return e;};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a;};
const norm=s=>(s||'').toLowerCase().replace(/[’‘`]/g,"'")
  .replace(/\bdidn't\b/g,'did not').replace(/\bthere's\b/g,'there is').replace(/\bdon't\b/g,'do not').replace(/\bcan't\b/g,'cannot').replace(/\bit's\b/g,'it is')
  .replace(/[.,!?;:"]/g,'').replace(/-/g,' ').replace(/\s+/g,' ').trim();

/* ================= players & storage ================= */
const KEY='educa-twins-u7u8';
let PL=['Twin 1','Twin 2'];
const R={};          // results: R[id] = {label, kind, p:[{s,t,w}], team:{s,t,w}}  (first try)
function save(){try{localStorage.setItem(KEY,JSON.stringify({PL,R}));}catch(e){}}
try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d){if(d.PL)PL=d.PL;if(d.R)Object.assign(R,d.R);}}catch(e){}
const nm=i=>el('span',{class:'nm p'+i,'data-p':i},PL[i]);
const teamTag=()=>el('span',{class:'nm tm'},'Team');
function refreshNames(){$$('[data-p]').forEach(s=>s.textContent=PL[+s.dataset.p]);}
function record(id,res){if(!R[id]){R[id]=res;save();}updateNav();}

const MODE={turns:['turns','Turns'],blind:['blind','Blind challenge'],team:['team','Team'],speed:['speed','Speed round']};
function head(card,n,title,mode,time,inst){
  card.append(el('div',{class:'step-h'},el('div',{class:'num'},n),el('h2',{},title),el('span',{class:'mode '+MODE[mode][0]},MODE[mode][1]),el('span',{class:'time'},time)),
    el('p',{class:'inst',html:inst}));
}

/* ================= item factory (turns & team) ================= */
function makeItem(it){
  const li=el('li',{});const q=el('div',{class:'q'});li.append(q);let api;
  if(it.who!=null){q.append(el('span',{class:'who'},it.who===2?teamTag():nm(it.who)));li.classList.add('o'+it.who);}
  if(it.type==='gap'){
    const inp=el('input',{type:'text',class:'g',autocomplete:'off',spellcheck:'false'});
    q.append(it.pre?it.pre+' ':'',inp,it.post?' '+it.post:'',it.hint?el('span',{class:'hint'},' '+it.hint):'');
    api={get:()=>inp.value,ok:()=>it.a.map(norm).includes(norm(inp.value)),mark:o=>inp.className='g '+(o?'ok-f':'bad-f'),show:()=>{inp.value=it.a[0];inp.className='g ok-f';}};
  }else if(it.type==='typed'){
    const inp=el('input',{type:'text',class:'w',autocomplete:'off',spellcheck:'false',placeholder:it.ph||'Type your answer…'});
    q.append(el('span',{html:it.q}),el('br'),inp);
    api={get:()=>inp.value,ok:()=>{const v=norm(inp.value);return it.test?it.test(v):it.a.map(norm).includes(v);},mark:o=>inp.className='w '+(o?'ok-f':'bad-f'),show:()=>{inp.value=it.a[0];inp.className='w ok-f';}};
  }else{ // choice
    let sel=null;const bs=[];
    if(it.q)q.append(el('span',{html:it.q}),el('br'));
    it.opts.forEach((o,k)=>{const b=el('button',{class:'opt',onclick:()=>{sel=k;bs.forEach((x,j)=>x.className='opt'+(j===k?' sel':''));}},o);bs.push(b);q.append(b);});
    api={get:()=>sel==null?'—':it.opts[sel],ok:()=>sel===it.a,mark:o=>{bs.forEach((x,j)=>x.className='opt'+(j===sel?(o?' ok':' bad'):''));},show:()=>{bs.forEach((x,j)=>x.className='opt'+(j===it.a?' ok':''));}};
  }
  const fb=el('div',{class:'fb'});li.append(fb);

function blindStep(o){

  let qi,ph,ch,pts,wrong,first=!R[o.id];

    box.innerHTML='';

        el('div',{class:'pts'},el('span',{},nm(0),` ${pts[0]} / ${o.qs.length}`),el('span',{},nm(1),` ${pts[1]} / ${o.qs.length}`),el('span',{},teamTag(),` ${pts[0]+pts[1]} / ${o.qs.length*2}`)),

    else box.append(el('div',{class:'turnban rev'},'Reveal!'));
    box.append(el('div',{class:'bq',html:Q.q}));
    const opts=el('div',{class:'bopts'});
    Q.opts.forEach((t,k)=>{
      const b=el('button',{class:'bopt'},el('span',{html:t}));

      else{const tags=el('span',{class:'tags'});[0,1].forEach(p=>{if(ch[p]===k)tags.append(nm(p));});b.append(tags);
        if(k===Q.a)b.classList.add('right');else if(ch.includes(k))b.classList.add('wrongc');b.style.cursor='default';}
      opts.append(b);});
    box.append(opts);
    if(ph===2){
      box.append(el('div',{class:'pts'},...[0,1].map(p=>el('span',{},nm(p),ch[p]===Q.a?' +1 point':' 0 points'))),
        Q.why?el('div',{class:'tip',html:Q.why}):null,
        el('div',{class:'bar'},el('button',{class:'btn',onclick:()=>{qi++;ph=0;ch=[null,null];render();}},qi+1<o.qs.length?'Next question →':'See the score')));
    }

  render=function(){if(ph===2&&!box._scored){[0,1].forEach(p=>{if(ch[p]===o.qs[qi].a)pts[p]++;else wrong[p].push(o.qs[qi].q.replace(/<[^>]+>/g,'').slice(0,50)+' → '+o.qs[qi].opts[ch[p]].replace(/<[^>]+>/g,''));});box._scored=true;}

function speedStep(o){

    const big=el('div',{class:'big'},'–');const miss=el('div',{class:'missed'});
    const b=el('button',{class:'btn '+(p?'b':'a'),onclick:()=>play(p)},'Start round');
    const d=el('div',{class:'sp p'+p},nm(p),big,el('div',{class:'inst',style:'margin:0'},'correct answers'),b,miss);wrap.append(d);return {big,miss,b};});
  const arena=el('div',{class:'arena'});wrap.append(arena);
  const total=el('div',{class:'score',style:'margin-top:10px'});card.append(total);
  let timer=null;
  function play(p){
    panes.forEach(x=>x.b.disabled=true);arena.style.display='block';
    let left=o.secs||60,ok=0,tried=0,missed=[],deck=shuffle(o.pool),idx=0,lock=false;
    arena.innerHTML='';const clock=el('div',{class:'clock'},left+'s');const def=el('div',{class:'def'});const grid=el('div',{class:'grid'});
    arena.append(clock,el('div',{},nm(p),' is playing…'),def,grid);
    function next(){if(idx>=deck.length){deck=shuffle(o.pool);idx=0;}const it=deck[idx++];def.textContent=it.d;grid.innerHTML='';
      const opts=shuffle([it,...shuffle(o.pool.filter(x=>x.w!==it.w)).slice(0,3)]);
      opts.forEach(x=>{const b=el('button',{onclick:()=>{if(lock)return;lock=true;tried++;
        if(x.w===it.w){ok++;b.classList.add('ok');setTimeout(()=>{lock=false;next();},350);}
        else{b.classList.add('bad');missed.push(it.w);$$('button',grid).forEach(y=>{if(y.textContent===it.w)y.classList.add('ok');});setTimeout(()=>{lock=false;next();},1100);}
        panes[p].big.textContent=ok;}},x.w);grid.append(b);});}
    next();panes[p].big.textContent='0';
    timer=setInterval(()=>{left--;clock.textContent=left+'s';if(left<=0){clearInterval(timer);end();}},1000);
    function end(){arena.innerHTML='';arena.append(el('div',{class:'bq'},`Time's up! `,nm(p),` ${ok} correct of ${tried}.`));
      panes[p].miss.textContent=missed.length?'Review: '+[...new Set(missed)].join(', '):'No mistakes!';
      if(!res[p])res[p]={s:ok,t:tried,w:[...new Set(missed)]};
      panes.forEach(x=>{x.b.disabled=false;});panes[p].b.textContent='Play again';
      if(res[0]&&res[1]){total.innerHTML='';total.append(teamTag(),` Team total: ${res[0].s+res[1].s} words`);record(o.id,{label:o.label,kind:'speed',p:res.map(r=>({...r}))});}}
  }
  return card;
}

   ()=>speedStep({id:'u7s1',n:'2',title:'Invention Speed Round',time:'5 min',label:'U7 · Vocabulary speed round',pool:U7POOL}),
   ()=>textGapStep({id:'u7s2',n:'3',title:'Thomas and the lamp',time:'5 min',label:'U7 · Vocabulary in context',

 {id:'u7g',u:'U7',tab:'Grammar',tag:'Unit 7 · Good Idea!',title:'Used to & “you” for general statements',
  explain:`<p><span class="hl">Used to</span> = hábitos ou situações do <b>passado</b> que <b>não acontecem mais</b> (≈ “costumava”).</p>
  <p><span class="formula">used to + verbo</span> People <b>used to travel</b> by boat.<br>
  <span class="formula">didn't use to + verbo</span> People <b>didn't use to have</b> cell phones.<br>
  <span class="formula">Did … use to + verbo?</span> <b>Did</b> people <b>use to read</b> by candlelight? — Yes, they <b>did</b>. / No, they <b>didn't</b>.</p>
  <p class="warn">Depois de did / didn't, o “d” sai: didn't use<s>d</s> to · Did you use<s>d</s> to…? Depois de used to, o verbo fica na forma base: used to ride (não rides / riding).</p>
  <p><span class="hl">You</span> para frases gerais: em inglês usamos <b>you</b> para falar de <b>qualquer pessoa</b> (como o “você” genérico em português).<br>
  You <b>need</b> creativity to invent things. · What <b>do you do</b> with this? — You <b>cut</b> meat <b>with it</b>. · You <b>use it to</b> cook food.</p>
  <p class="warn">Uma coisa → <b>it</b> (a knife → with it). Duas ou mais / plural → <b>them</b> (scissors, crayons → with them).</p>`,
  steps:[
   ()=>listStep({id:'u7s3',n:'4',title:'Complete with used to',mode:'turns',time:'6 min',label:'U7 · Used to (complete)',
     inst:'Take turns! Look at your name and write the correct form: <b>used to / didn\'t use to / Did … use to</b> + verb.',
     items:[
      {type:'gap',pre:'In the 1800s, people',post:'by candlelight.',hint:'(read)',a:['used to read']},
      {type:'gap',pre:'Before cars, people',post:'horses in the city.',hint:'(ride)',a:['used to ride']},
      {type:'gap',pre:'My grandparents',post:'a cell phone.',hint:'(not / have)',a:['didn\'t use to have','did not use to have']},
      {type:'gap',pre:'',post:'video games when you were six?',hint:'(you / play)',a:['Did you use to play']},
      {type:'gap',pre:'Before planes, people',post:'by air.',hint:'(not / travel)',a:['didn\'t use to travel','did not use to travel']},
      {type:'gap',pre:'When I was little, I',post:'afraid of the dark.',hint:'(be)',a:['used to be']},
      {type:'gap',pre:'',post:'to school by bike?',hint:'(your mom / go)',a:['Did your mom use to go']},
      {type:'gap',pre:'We',post:'vegetables, but now we love them!',hint:'(not / like)',a:['didn\'t use to like','did not use to like']}]}),
   ()=>blindStep({id:'u7s4',n:'5',title:'Used to — who\'s right?',time:'6 min',label:'U7 · Used to (blind)',qs:[
      {q:'Before TV, children ___ play outside more.',opts:['use to','used to','using to'],a:1},
      {q:'People ___ use to have computers in 1920.',opts:['didn\'t','don\'t','weren\'t'],a:0},
      {q:'Did people ___ write letters?',opts:['used to','use to','uses to'],a:1,why:'After <b>did</b>, we write <b>use to</b> (no “d”).'},
      {q:'My dad used to ___ a skateboard.',opts:['rides','riding','ride'],a:2},
      {q:'Which sentence is about a past habit that <b>stopped</b>?',opts:['I use my tablet every day.','I used to watch cartoons every morning.','I\'m watching a cartoon now.'],a:1},
      {q:'“Did you use to have a pet?” — “Yes, I ___.”',opts:['used','do','did'],a:2}]}),
   ()=>listStep({id:'u7s5',n:'6',title:'Write clues about inventions',mode:'turns',time:'6 min',label:'U7 · You for general statements',
     inst:'Take turns! Write a clue that starts with <b>You</b>. Example: knife (cut meat) → <i>You cut meat with it.</i> Remember: <b>it</b> or <b>them</b>?',
     items:[
      {type:'typed',q:'<b>a microwave</b> (cook food)',a:['You cook food with it.'],test:yesTest(/cook/,'it'),tip:'Start with “You”, use “cook” and “it”.'},
      {type:'typed',q:'<b>a backpack</b> (carry things)',a:['You carry things in it.'],test:yesTest(/carry/,'it'),tip:'Start with “You”, use “carry” and “it”.'},
      {type:'typed',q:'<b>a cell phone</b> (make calls)',a:['You make calls with it.'],test:yesTest(/call/,'it'),tip:'Start with “You”, use “calls” and “it”.'},
      {type:'typed',q:'<b>scissors</b> (cut paper)',a:['You cut paper with them.'],test:yesTest(/cut/,'them'),tip:'Scissors are plural → them.'},
      {type:'typed',q:'<b>crayons</b> (color pictures)',a:['You color pictures with them.'],test:yesTest(/colou?r/,'them'),tip:'Crayons are plural → them.'},
      {type:'typed',q:'<b>an umbrella</b> (when it\'s raining)',a:['You use it when it\'s raining.'],test:v=>/^you\b/.test(v)&&/rain/.test(v)&&/\bit\b/.test(v),tip:'Try: You use it when …'}]}),
   ()=>listStep({id:'u7s6',n:'7',title:'How do you use it?',mode:'team',time:'5 min',label:'U7 · How to use it (team)',
     inst:'Work together. Part A: choose the verb for the hula hoop instructions. Part B: read the riddles and guess the invention.',
     items:[
      {type:'choice',q:'First, you ___ the hula hoop on the ground and stand in the middle.',opts:['put','pull','turn'],a:0},
      {type:'choice',q:'Then you ___ the hoop up to your waist.',opts:['push','lift','fail'],a:1},
      {type:'choice',q:'Next, you ___ your waist in a circle. Don\'t hold the hoop!',opts:['move','invent','put'],a:0},
      {type:'choice',q:'The hoop ___ around and around you. It\'s fun!',opts:['lifts','tries','turns'],a:2},
      {type:'choice',q:'<i>You wear it on your wrist. You look at it to know the time.</i>',opts:['a watch','a battery','a wheel'],a:0},
      {type:'choice',q:'<i>You put it in a toy or a remote control. It gives them electricity.</i>',opts:['a screen','a battery','a backpack'],a:1},
      {type:'choice',q:'<i>You sit on it and you push the pedals with your feet.</i>',opts:['a plane','a bicycle','a car'],a:1},
      {type:'choice',q:'<i>You write a note on it and you stick it on your notebook.</i>',opts:['a sticky note','a comic book','a crayon'],a:0}]})
 ]},

 {id:'u7r',u:'U7',tab:'Reading & Writing',tag:'Unit 7 · Good Idea!',title:'Reading & writing',
  explain:`<p><b>Fact</b> (fato) = algo verdadeiro, que dá para provar: datas, nomes, eventos. <i>The Wright brothers flew a plane in 1903.</i></p>
  <p><b>Opinion</b> (opinião) = o que alguém pensa ou sente. Pistas: <b>In my opinion, I think, I believe</b>, e palavras como <b>best, cool, boring, great, the most useful</b>.</p>`,
  steps:[
   ()=>blindStep({id:'u7s7',n:'8',title:'Read: Grandpa Joe\'s Life',time:'8 min',label:'U7 · Reading (True/False)',before:textBox(READ7),
     inst:'Read the text together first. Then: <b>True, False or Doesn\'t say?</b> One chooses, the other looks away!',qs:[
      {q:'Joe\'s family used to have a fridge.',opts:TFD,a:1},
      {q:'Joe used to walk to school.',opts:TFD,a:0},
      {q:'Joe\'s house had electricity when he was a boy.',opts:TFD,a:1},
      {q:'Joe thinks the washing machine is the most useful invention.',opts:TFD,a:0},
      {q:'Joe\'s mother used to wash the clothes in a river.',opts:TFD,a:2,why:'The text says “by hand”, but it doesn\'t say <b>where</b>.'},
      {q:'Joe loves his cell phone.',opts:TFD,a:1}]}),
   ()=>listStep({id:'u7s8',n:'9',title:'Answer the questions',mode:'turns',time:'5 min',label:'U7 · Reading (questions)',
     inst:'Take turns. Look back at the text if you need to. Short answers are OK.',
     items:[
      {type:'typed',q:'How did Joe\'s family keep milk and meat cold?',a:['In a cold box with ice.'],test:v=>/ice/.test(v),ph:'They kept it …'},
      {type:'typed',q:'Why did Joe walk to school?',a:['Because there weren\'t any buses in his village.'],test:v=>/bus/.test(v),ph:'Because …'},
      {type:'choice',q:'Which sentence is an <b>opinion</b>?',opts:['Joe\'s family didn\'t have a fridge.','The washing machine is the most useful invention.','There were no buses in the village.'],a:1},
      {type:'choice',q:'Which sentence is a <b>fact</b>?',opts:['Cell phones are boring.','Inventions are amazing.','Joe walked three kilometers to school.'],a:2}]}),
   ()=>listStep({id:'u7s9',n:'10',title:'Fact or opinion?',mode:'turns',time:'4 min',label:'U7 · Fact or opinion',
     inst:'Take turns. Is it a <b>Fact</b> or an <b>Opinion</b>?',
     items:[
      ['The Wright brothers flew a plane in 1903.',0],['In my opinion, planes are the best invention.',1],['Sticky notes are really cool.',1],['Batteries give electricity to toys and phones.',0],
      ['Louis Braille invented an alphabet for blind people.',0],['I think video games are more fun than TV.',1],['People used to read by candlelight.',0],['I believe the wheel is the most important invention.',1]
     ].map(([q,a])=>({type:'choice',q,opts:['Fact','Opinion'],a}))}),
   ()=>notebookStep({n:'11',title:'My favorite invention',time:'10 min',task:'Write in your notebook: “A Great Invention”',
     inst:'Each twin chooses a <b>different</b> invention. Write <b>60–80 words</b>. Use facts AND opinions.',
     checks:['I said <b>what</b> the invention is.','I explained how <b>you</b> use it (You … with it.)','I wrote a <b>fact</b>.','I wrote my <b>opinion</b> (In my opinion / I think …)','I used <b>used to</b> (Before …, people used to …)','I explained <b>why</b> I like it.'],
     model:'<i>In my opinion, the bicycle is a great invention. A bicycle has two wheels and you push the pedals with your feet. You use it to go to school, to the park or to a friend\'s house. Before bicycles, people used to walk everywhere. I think bicycles are useful because they are fast and they don\'t need electricity. They are also good exercise!</i>'})
 ]},

 {id:'u8g',u:'U8',tab:'Grammar',tag:'Unit 8 · That\'s Really Interesting!',title:'Who & direct / indirect objects',
  explain:`<p><span class="hl">Who</span> = “que”, para <b>pessoas</b>. Ele junta duas frases e <b>substitui</b> he / she / they.</p>
  <p>I have a brother. <s>He</s> loves video games. → I have a brother <b>who loves</b> video games.<br>
  The person <b>who has</b> the highest score wins. · I know two girls <b>who collect</b> fossils.</p>
  <p class="warn">Não repita o pronome: <s>a brother who he loves</s>. O verbo concorda com a pessoa: a girl who collect<b>s</b> / girls who collect.</p>
  <p><span class="hl">Direct & indirect objects</span> — duas formas de dizer a mesma coisa:</p>
  <p><span class="formula">give / send / show / write + coisa + to + pessoa</span> = <span class="formula">verbo + pessoa + coisa</span><br>
  My dad gave this fossil <b>to me</b>. = My dad gave <b>me</b> this fossil.</p>
  <p><span class="formula">buy / make / get + coisa + for + pessoa</span> = <span class="formula">verbo + pessoa + coisa</span><br>
  My mom bought stuffed animals <b>for them</b>. = My mom bought <b>them</b> stuffed animals.</p>
  <p class="warn">Na forma curta, sem to / for: <s>She gave to me a book</s> → She gave me a book. Use me, you, him, her, us, them (não I, he, she, they).</p>`,
  steps:[
   ()=>listStep({id:'u8s4',n:'5',title:'Join the sentences with who',mode:'turns',time:'6 min',label:'U8 · Who (join)',
     inst:'Take turns. Join the two sentences with <b>who</b>. Write the whole sentence.',
     items:[
      {type:'typed',q:'I have a cousin. She plays the guitar.',a:['I have a cousin who plays the guitar.']},
      {type:'typed',q:'I know a boy. He collects fossils.',a:['I know a boy who collects fossils.']},
      {type:'typed',q:'There is a girl in my class. She takes amazing photos.',a:['There is a girl in my class who takes amazing photos.','There\'s a girl in my class who takes amazing photos.']},
      {type:'typed',q:'I have two friends. They play in a musical group.',a:['I have two friends who play in a musical group.']},
      {type:'typed',q:'The person wins. He has the highest score.',a:['The person who has the highest score wins.'],tip:'Put who right after “The person”.'},
      {type:'typed',q:'We know some kids. They compete in video game competitions.',a:['We know some kids who compete in video game competitions.']}]}),
   ()=>blindStep({id:'u8s5',n:'6',title:'Who — who\'s right?',time:'5 min',label:'U8 · Who (blind)',qs:[
      {q:'Which sentence is correct?',opts:['I have a friend who he likes comics.','I have a friend who likes comics.','I have a friend who like comics.'],a:1},
      {q:'I know two girls who ___ stuffed animals.',opts:['collects','collect','collecting'],a:1},
      {q:'The boy ___ won the game is my brother.',opts:['who','he','what'],a:0},
      {q:'This is someone who ___ books.',opts:['enjoy','enjoys','enjoying'],a:1},
      {q:'“This person is someone who takes photos for a newspaper.” Who is it?',opts:['a painter','a photographer','a musician'],a:1},
      {q:'My grandma is a person who ___ very creative.',opts:['is','are','be'],a:0}]}),
   ()=>listStep({id:'u8s6',n:'7',title:'Rewrite the sentences',mode:'turns',time:'6 min',label:'U8 · Objects (rewrite)',
     inst:'Take turns. Rewrite without <b>to / for</b>. Example: My cousin sent a book to him. → <i>My cousin sent him a book.</i>',
     items:[
      {type:'typed',q:'My uncle gave a comic book to me.',a:['My uncle gave me a comic book.']},
      {type:'typed',q:'Grandma sent a letter to him.',a:['Grandma sent him a letter.']},
      {type:'typed',q:'My mom bought a stuffed animal for her.',a:['My mom bought her a stuffed animal.']},
      {type:'typed',q:'I showed my fossils to them.',a:['I showed them my fossils.']},
      {type:'typed',q:'Dad made a cake for us.',a:['Dad made us a cake.']},
      {type:'typed',q:'She wrote a long message to her best friend.',a:['She wrote her best friend a long message.']}]}),
   ()=>blindStep({id:'u8s7',n:'8',title:'To, for or pronoun?',time:'5 min',label:'U8 · Objects (blind)',qs:[
      {q:'I gave a pair of socks ___ Maria.',opts:['to','for'],a:0},
      {q:'Mom bought a new controller ___ my brother.',opts:['to','for'],a:1,why:'<b>buy</b> → for'},
      {q:'My friend gave ___ a toy dinosaur.',opts:['I','me','my'],a:1},
      {q:'We sent ___ a postcard from the beach.',opts:['they','their','them'],a:2},
      {q:'Which sentence is correct?',opts:['She showed to me her photos.','She showed me her photos.','She showed me to her photos.'],a:1},
      {q:'Can you make ___ a sandwich, please?',opts:['I','me','mine'],a:1}]}),
   ()=>unscrambleStep({id:'u8s8',n:'9',title:'Build the sentence',time:'4 min',label:'U8 · Objects (unscramble)',
     inst:'Work together. Click the words in the right order. Click a word again to send it back.',
     items:['My sister gave me a fossil.','I bought a comic book for him.','We showed them the photos.','Grandpa sent a letter to us.']})
 ]},

 {id:'u8r',u:'U8',tab:'Reading & Writing',tag:'Unit 8 · That\'s Really Interesting!',title:'Reading & writing',
  explain:`<p><b>Explanation writing</b>: você explica <b>o que é</b> uma coisa e <b>como se faz</b>.</p>
  <p>• <b>Definition</b> (definição): <i>Origami is the Japanese art of folding paper.</i><br>
  • <b>How you do it</b>: <i>You fold the paper many times.</i><br>
  • <b>Examples</b>: use <b>for example</b> e <b>such as</b> → <i>You can make animals, such as a frog or a bird.</i></p>`,
  steps:[
   ()=>blindStep({id:'u8s9',n:'10',title:'Read: Ben\'s Unusual Hobby',time:'8 min',label:'U8 · Reading (True/False)',before:textBox(READ8),
     inst:'Read the text together first. Then: <b>True, False or Doesn\'t say?</b> One chooses, the other looks away!',qs:[
      {q:'Ben started collecting fossils when he was twelve.',opts:TFD,a:1},
      {q:'Ben\'s aunt works at a museum.',opts:TFD,a:0},
      {q:'Ben goes fossil hunting alone.',opts:TFD,a:1},
      {q:'Ben always finds fossils when he looks for them.',opts:TFD,a:1},
      {q:'Ben\'s favorite fossil is a dinosaur tooth.',opts:TFD,a:0},
      {q:'Ben\'s aunt has a big fossil collection.',opts:TFD,a:2}]}),
   ()=>listStep({id:'u8s10',n:'11',title:'Answer the questions',mode:'turns',time:'5 min',label:'U8 · Reading (questions)',
     inst:'Take turns. Look back at the text if you need to.',
     items:[
      {type:'typed',q:'Who gave Ben his first fossil?',a:['His aunt.'],test:v=>/aunt/.test(v)},
      {type:'typed',q:'Name <b>two</b> things you need for fossil hunting.',a:['A hammer and a brush.'],test:v=>['hammer','brush','notebook','patience'].filter(k=>v.includes(k)).length>=2},
      {type:'choice',q:'What does Ben do <b>first</b> when he finds a fossil?',opts:['He takes a photo of it.','He cleans it with the brush.','He writes in his notebook.'],a:1},
      {type:'choice',q:'“His aunt gave him a small fossil.” = His aunt gave a small fossil ___ him.',opts:['to','for','at'],a:0}]}),
   ()=>listStep({id:'u8s11',n:'12',title:'Definition, how or example?',mode:'turns',time:'4 min',label:'U8 · Explanation writing',
     inst:'Take turns. Is the sentence a <b>Definition</b>, <b>How you do it</b> or an <b>Example</b>?',
     items:[
      ['Geocaching is an outdoor game like hide and seek.',0],['You can find small things in the box, for example, a toy car.',2],['First, you look for clues on the app.',1],
      ['You can make simple shapes, such as a frog or a bird.',2],['Origami is the Japanese art of folding paper.',0],['You fold the paper many times.',1]
     ].map(([q,a])=>({type:'choice',q,opts:['Definition','How you do it','Example'],a}))}),
   ()=>notebookStep({n:'13',title:'Explain a hobby',time:'10 min',task:'Write in your notebook: “My Hobby”',
     inst:'Each twin chooses a <b>different</b> hobby. Write <b>60–80 words</b> to explain it.',
     checks:['I wrote a <b>definition</b> (… is …)','I explained <b>how you do it</b> (You …)','I said what <b>you need</b>.','I gave an <b>example</b> with <b>for example</b> or <b>such as</b>.','I used <b>who</b> (It\'s a good hobby for people who …)','I wrote my <b>opinion</b>.'],
     model:'<i>Skateboarding is a sport and a hobby. You stand on a board with four wheels and you push the ground with one foot. You need a skateboard, a helmet and a lot of practice! You can learn tricks, for example, the ollie. It\'s a great hobby for people who like adventure. My friend Leo, who skates every weekend, gave me my first skateboard. I think it\'s really fun!</i>'})
 ]},

 {id:'boss',tab:'Boss Battle',tag:'Final challenge',title:'Boss Battle — Units 7 & 8',steps:[
   ()=>blindStep({id:'boss1',n:'★',title:'Boss Battle',time:'8 min',label:'Boss Battle (Units 7 & 8)',
     inst:'The final challenge mixes <b>both units</b>, just like the test. One chooses, the other looks away. Who will win the most points?',qs:[
      {q:'When I was five, I ___ sleep with a stuffed animal.',opts:['use to','used to','using to'],a:1},
      {q:'Did you ___ collect anything when you were little?',opts:['used to','use to','uses to'],a:1},
      {q:'He\'s the boy ___ won the video game competition.',opts:['who','he','what'],a:0},
      {q:'My grandpa bought ___ a skateboard.',opts:['I','my','me'],a:2},
      {q:'How do you use scissors? — You cut paper with ___.',opts:['it','them','they'],a:1},
      {q:'She sent a postcard ___ her cousin.',opts:['to','for'],a:0},
      {q:'Which is an <b>opinion</b>?',opts:['Batteries give electricity to toys.','I think geocaching is exciting.','Fossils are very old.'],a:1},
      {q:'Before cell phones, people ___ send text messages.',opts:['didn\'t used to','don\'t use to','didn\'t use to'],a:2}]})

 {id:'results',tab:'Results',tag:'Results',title:'Our results',build:resultsPage}
];

/* ================= start page ================= */
function startPage(){
  const v=el('div',{});
  const card=el('div',{class:'card'});
  card.append(el('p',{class:'inst',style:'font-size:15.5px;color:var(--ink)',html:'Today we are reviewing <b>Unit 7 – Good Idea!</b> and <b>Unit 8 – That\'s Really Interesting!</b> for the test. First, write your names:'}));
  const ins=[0,1].map(p=>el('input',{type:'text',value:PL[p].startsWith('Twin')?'':PL[p],placeholder:'Name '+(p+1),oninput:e=>{PL[p]=e.target.value.trim()||('Twin '+(p+1));refreshNames();save();}}));
  card.append(el('div',{class:'names'},...[0,1].map(p=>el('div',{class:'p'+p},el('label',{},nm(p),' plays in this color'),ins[p]))));
  card.append(el('h2',{style:'color:var(--p);font-size:18px;margin-top:6px'},'How we play'),
    el('div',{class:'modes'},
      el('div',{},el('span',{class:'mode turns'},'Turns'),el('br'),'Each question has a name. Answer <b>your</b> questions — no help from your brother/sister!'.replace(/<b>|<\/b>/g,'')),
      el('div',{},el('span',{class:'mode blind'},'Blind challenge'),el('br'),'Same question for both. One answers while the other looks away. Then we reveal!'),
      el('div',{},el('span',{class:'mode team'},'Team'),el('br'),'Talk in English and agree on ONE answer together.'),
      el('div',{},el('span',{class:'mode speed'},'Speed round'),el('br'),'60 seconds each. How many words can you get?')),
    el('div',{class:'tip',html:'You get points for you <b>and</b> for the team. In the end, the most important score is the <b>Team score</b>!'}));
  v.append(card);return v;
}

/* ================= results ================= */
function resultsPage(){const v=el('div',{});v.append(el('div',{class:'card',id:'res'}));return v;}
const fmt=x=>x?`${x.s}/${x.t}`:'—';
function renderResults(){
  const c=$('#res');c.innerHTML='';
  const ids=[];PARTS.forEach(p=>(p._ids||[]).forEach(i=>ids.push(i)));
  let T=[{s:0,t:0},{s:0,t:0}],TM={s:0,t:0};
  const tb=el('table',{class:'res'},el('tr',{},el('th',{},'Step'),el('th',{},PL[0]),el('th',{},PL[1]),el('th',{},'Team')));
  ids.forEach(([id,label])=>{const r=R[id];const tr=el('tr',{});
    if(!r){tr.append(el('td',{},label),el('td',{class:'c wrong'},'—'),el('td',{class:'c wrong'},'—'),el('td',{class:'c wrong'},'not done'));tb.append(tr);return;}
    if(r.kind==='team'){TM.s+=r.team.s;TM.t+=r.team.t;tr.append(el('td',{},label,r.team.w.length?el('div',{class:'wrong'},'Mistakes: '+r.team.w.join(' · ')):null),el('td',{class:'c'},'·'),el('td',{class:'c'},'·'),el('td',{class:'c'},fmt(r.team)));}
    else{const sp=r.kind==='speed';
      if(!sp)r.p.forEach((x,i)=>{T[i].s+=x.s;T[i].t+=x.t;});
      const sum=sp?{s:r.p[0].s+r.p[1].s,t:null}:{s:r.p[0].s+r.p[1].s,t:r.p[0].t+r.p[1].t};
      if(!sp){TM.s+=sum.s;TM.t+=sum.t;}
      tr.append(el('td',{},label,...r.p.map((x,i)=>x.w.length?el('div',{class:'wrong'},PL[i]+(sp?' – review: ':' – mistakes: ')+x.w.join(' · ')):null)),
        ...r.p.map(x=>el('td',{class:'c'},sp?`${x.s} words`:fmt(x))),el('td',{class:'c'},sp?`${sum.s} words`:fmt(sum)));}
    tb.append(tr);});
  tb.append(el('tr',{class:'tot'},el('td',{},'TOTAL (without speed rounds)'),el('td',{class:'c'},fmt(T[0])),el('td',{class:'c'},fmt(T[1])),el('td',{class:'c'},fmt(TM))));
  const pct=x=>x.t?Math.round(100*x.s/x.t)+'%':'—';
  c.append(el('p',{class:'inst',html:'Scores show the <b>first try</b> of each step. Mistakes show what to review before the test!'}),
    el('div',{class:'bigs'},el('div',{class:'p0'},PL[0],el('b',{},pct(T[0]))),el('div',{class:'p1'},PL[1],el('b',{},pct(T[1]))),el('div',{class:'tm'},'Team',el('b',{},pct(TM)))),tb);
  const txt=()=>{const L=[`Units 7 & 8 · Exam Review — ${PL[0]} & ${PL[1]} (first try)`,''];
    ids.forEach(([id,label])=>{const r=R[id];if(!r){L.push(`${label}: not done`);return;}
      if(r.kind==='team')L.push(`${label} — Team ${fmt(r.team)}`+(r.team.w.length?`\n   mistakes: ${r.team.w.join(' | ')}`:''));
      else{const sp=r.kind==='speed';L.push(`${label} — `+r.p.map((x,i)=>`${PL[i]} ${sp?x.s+' words':fmt(x)}`).join(' · '));r.p.forEach((x,i)=>{if(x.w.length)L.push(`   ${PL[i]}: ${x.w.join(' | ')}`);});}});
    L.push('',`TOTAL — ${PL[0]} ${fmt(T[0])} (${pct(T[0])}) · ${PL[1]} ${fmt(T[1])} (${pct(T[1])}) · Team ${fmt(TM)} (${pct(TM)})`);return L.join('\n');};
  const msg=el('span',{class:'score'});const pre=el('textarea',{readonly:'',style:'width:100%;height:150px;margin-top:10px;font:12px monospace;border:1.5px solid var(--l);border-radius:10px;padding:8px;display:none'});
  const conf=el('div',{class:'tip',style:'display:none;align-items:center;gap:10px;flex-wrap:wrap'},'This clears all the scores. Are you sure?',el('button',{class:'btn',onclick:()=>{try{localStorage.removeItem(KEY);}catch(e){}location.hash='';location.reload();}},'Yes, start again'));
  c.append(el('div',{class:'bar'},el('button',{class:'btn',onclick:async()=>{pre.value=txt();try{await navigator.clipboard.writeText(pre.value);msg.textContent='Copied! Paste it in the chat for your teacher.';}catch(e){pre.style.display='block';pre.select();msg.textContent='Copy the text below and send it to your teacher.';}}},'Copy our results'),
    el('button',{class:'btn sec',onclick:()=>{conf.style.display=conf.style.display==='none'?'flex':'none';}},'Start again'),msg),conf,pre);
}

/* ================= views ================= */
let current=0;
function buildPart(p){const v=el('section',{});v.append(el('div',{class:'part-h'},el('b',{},p.tag),el('h1',{},p.title)));
  if(p.explain)v.append(el('details',{class:'explain',open:''},el('summary',{},'Entenda (resumo em português)'),el('div',{class:'in',html:p.explain})));
  if(p.build)v.append(p.build());
  p._ids=[];(p.steps||[]).forEach(f=>{const c=f();v.append(c);});
  return v;}
function updateNav(){PARTS.forEach((p,i)=>{const d=$(`#nav button[data-i="${i}"] .dot`);if(d)d.classList.toggle('done',p._ids.length&&p._ids.every(([id])=>R[id]));});}
function show(i){current=i;$$('main>section').forEach((s,j)=>s.style.display=j===i?'':'none');$$('#nav button').forEach((b,j)=>b.classList.toggle('on',j===i));
  if(PARTS[i].id==='results')renderResults();window.scrollTo(0,0);try{history.replaceState(null,'','#'+PARTS[i].id);}catch(e){}}
(function init(){
  // collect step ids/labels for results & nav dots by wrapping the factories
  const wrap=(fn)=>o=>{if(o.id&&o.label)curIds.push([o.id,o.label]);return fn(o);};
  let curIds;
  const F={listStep,blindStep,speedStep,sortStep,unscrambleStep,textGapStep};
  for(const k in F)window[k]=wrap(F[k]);
  const nav=$('#nav'),main=$('#main');
  PARTS.forEach((p,i)=>{curIds=[];
    const b=el('button',{'data-i':i,onclick:()=>show(i)},p.u?el('span',{class:'u'},p.u):null,p.tab);
    const v=buildPart(p);p._ids=curIds;if(p.steps)b.append(el('span',{class:'dot'}));nav.append(b);
    v.append(el('div',{class:'navbtns'},i>0?el('button',{class:'btn sec',onclick:()=>show(i-1)},'← Back'):el('span'),i<PARTS.length-1?el('button',{class:'btn',onclick:()=>show(i+1)},'Next →'):el('span')));main.append(v);});
  updateNav();
  const h=location.hash.slice(1);const k=PARTS.findIndex(p=>p.id===h);show(k>=0?k:0);
})();
</script>
