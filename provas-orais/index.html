<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oral Exam · Educa&amp;Cia</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--p:#583F84;--p2:#7a62a8;--pl:#f3eef9;--line:#e6ddf2;--ink:#2a1a4a;--mut:#5d5278;--bg:#fbfafe;
--cq:#c9504b;--cpic:#b07a00;--cread:#1d7a89;--cw:#4f8a1f;--ccrit:#a8325b;
--ok:#2f8f6b;--okl:#e5f4ee;--half:#b07a00;--halfl:#fff4dc;--no:#c9483e;--nol:#fbe7e4;--skip:#5d5278;--skipl:#eeeaf4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5}
button{font-family:inherit;cursor:pointer}a{color:var(--p)}
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topin{max-width:1180px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:9px}.logo .li{height:44px}.logo .lw{height:19px;display:block}
.ttl{text-align:right}.ttl small{display:block;font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--mut)}
.ttl b{display:block;font-size:20px;color:var(--p);line-height:1.2}
.wrap{max-width:1180px;margin:0 auto;padding:20px 18px 40px}.narrow{max-width:520px}.mid{max-width:860px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:16px}
.sec{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin:0 0 12px}
.sec:before{content:'';width:5px;height:22px;border-radius:3px;background:currentColor}
.c-q{color:var(--cq)}.c-pic{color:var(--cpic)}.c-read{color:var(--cread)}.c-w{color:var(--cw)}.c-crit{color:var(--ccrit)}.c-p{color:var(--p)}
h1{font-size:30px;color:var(--p);margin:0 0 8px;line-height:1.2}h2{font-size:21px;color:var(--p);margin:0 0 8px}h3{font-size:15px;color:var(--p);margin:0 0 6px}
.mut{color:var(--mut);font-size:14px}.tiny{font-size:12.5px;color:var(--mut)}.center{text-align:center}
.btn{background:var(--p);color:#fff;border:0;border-radius:12px;padding:11px 18px;font-size:15px;font-weight:600}
.btn.sec2{background:var(--pl);color:var(--p)}.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:10px}.btn.full{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.inp,select,textarea{width:100%;font-family:inherit;font-size:15px;padding:10px 12px;border:1.5px solid #d9cfe8;border-radius:12px;outline:none;background:#fff;color:var(--ink)}
.inp:focus,select:focus,textarea:focus{border-color:var(--p)}textarea{resize:vertical;min-height:70px;line-height:1.45}
label.lb{display:block;font-size:11.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);margin:12px 0 4px}
.chip{display:inline-block;font-size:12px;font-weight:600;border-radius:20px;padding:3px 10px;background:var(--skipl);color:var(--skip);white-space:nowrap}
.chip.and{background:var(--halfl);color:var(--half)}.chip.ras{background:#e8eefb;color:#3a5fa8}.chip.apr{background:var(--okl);color:var(--ok)}
table.t{width:100%;border-collapse:collapse;font-size:14.5px}table.t th{text-align:left;font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);padding:8px;border-bottom:1.5px solid var(--line)}
table.t td{padding:9px 8px;border-bottom:1px solid #f0ebf6;vertical-align:middle}
.err{color:var(--no);font-size:14px;min-height:20px;margin-top:8px}
#net{display:none;position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--no);color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;z-index:50}
.toast{position:fixed;bottom:18px;right:18px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s}
.toast.on{opacity:1}
/* teacher runner */
.wrap.wide{max-width:1480px}
.run{display:grid;grid-template-columns:250px minmax(0,1fr) 310px;gap:16px;align-items:start}
@media(max-width:1150px){.run{grid-template-columns:230px minmax(0,1fr)}.notesp{grid-column:2}}
@media(max-width:760px){.run{grid-template-columns:1fr}.notesp{grid-column:auto}}
.side{position:sticky;top:84px}.side .card{padding:16px}
.notesp textarea{min-height:220px}.notesp textarea.g{min-height:110px}
details.cod summary{cursor:pointer;font-size:11.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);margin:12px 0 4px;list-style:none;display:flex;align-items:center;gap:6px}
details.cod summary::-webkit-details-marker{display:none}details.cod summary:after{content:'';width:7px;height:7px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(-45deg);margin-left:2px;transition:transform .15s}details.cod[open] summary:after{transform:rotate(45deg)}
.vbar{height:6px;border-radius:4px;background:#dfe9d3;overflow:hidden;flex-basis:100%}.vbar i{display:block;height:100%;background:var(--cw)}
.wlay{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}.wlay.nov{grid-template-columns:1fr}
@media(max-width:820px){.wlay{grid-template-columns:1fr}}
.wnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.wdots{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.wdots button{width:32px;height:32px;border-radius:50%;border:1.5px solid #d9cfe8;background:#fff;font-size:13px;font-weight:600;color:var(--ink)}
.wdots button.ans{background:var(--cw);border-color:var(--cw);color:#fff}.wdots button.cur{box-shadow:0 0 0 3px #cfe3bd}
.st.wide{max-width:1200px}
.who{display:flex;align-items:center;gap:8px;font-size:14px}.dot{width:10px;height:10px;border-radius:50%;background:#c9c2d6;flex:none}.dot.on{background:var(--ok)}
.code{font-size:26px;font-weight:700;letter-spacing:4px;color:var(--p)}
.steps{display:flex;flex-direction:column;gap:3px;max-height:52vh;overflow:auto;margin-top:6px}
.steps button{border:0;background:none;text-align:left;font-size:13px;padding:5px 9px;border-radius:9px;display:flex;align-items:center;gap:8px;color:var(--ink)}
.steps button.on{background:var(--pl);font-weight:600}.steps button .m{width:9px;height:9px;border-radius:50%;background:#ddd5e8;flex:none}
.m.ok{background:var(--ok)!important}.m.half{background:var(--half)!important}.m.no{background:var(--no)!important}.m.skip{background:#fff!important;border:2px solid var(--skip)}.m.vis{background:var(--p2)!important}
.qbig{font-size:22px;font-weight:600;line-height:1.4;margin:6px 0 16px}
.marks{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:8px 0 14px}.marks.three{grid-template-columns:repeat(3,1fr)}
.mk{border:2px solid;border-radius:14px;padding:13px 6px;font-size:15px;font-weight:700;background:#fff}
.mk.ok{border-color:var(--ok);color:var(--ok)}.mk.half{border-color:var(--half);color:var(--half)}.mk.no{border-color:var(--no);color:var(--no)}.mk.skip{border-color:#cfc6dd;color:var(--skip)}
.mk.ok.sel{background:var(--ok);color:#fff}.mk.half.sel{background:var(--half);color:#fff}.mk.no.sel{background:var(--no);color:#fff}.mk.skip.sel{background:var(--skip);color:#fff;border-color:var(--skip)}
.mk small{display:block;font-size:11px;font-weight:500;opacity:.85}
.tog{display:flex;align-items:center;gap:10px;background:var(--pl);border-radius:12px;padding:10px 14px;font-size:14.5px;margin:4px 0 12px}
.tog input{width:20px;height:20px;accent-color:var(--p)}
.hint{background:#f7f4fc;border-left:4px solid var(--p2);border-radius:10px;padding:9px 13px;font-size:14px;margin:0 0 12px}
.navb{display:flex;gap:10px;margin-top:14px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.thumbs img{height:70px;border-radius:8px;border:3px solid transparent;cursor:pointer}.thumbs img.on{border-color:var(--cpic)}
.wgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.wcell{border:1.5px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-size:13px}.wcell b{display:block;font-size:20px}
.wcell.ok{background:var(--okl);border-color:var(--ok)}.wcell.no{background:var(--nol);border-color:var(--no)}
.crow{display:grid;grid-template-columns:1fr repeat(5,82px);gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid #f0ebf6;font-size:14px}
.crow.h{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);text-align:center}.crow.h span:first-child{text-align:left}
.lv{border:1.5px solid #d9cfe8;background:#fff;border-radius:10px;padding:7px 2px;font-size:12.5px;font-weight:600;color:var(--mut)}
.lv.sel{background:var(--ccrit);border-color:var(--ccrit);color:#fff}
@media(max-width:700px){.crow{grid-template-columns:1fr;}.crow.h{display:none}.crow .lvs{display:flex;gap:4px}}
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0 16px}
.score div{background:var(--pl);border-radius:14px;padding:12px 14px}.score b{display:block;font-size:22px;color:var(--p)}.score span{font-size:12.5px;color:var(--mut)}
.score .fin{background:var(--p)}.score .fin b,.score .fin span{color:#fff}
.notelist{font-size:13.5px;margin:0;padding-left:18px}.notelist li{margin:3px 0}
/* student */
.st{max-width:900px;margin:0 auto;padding:26px 18px 60px}
.st .card{padding:28px}
.hero{text-align:center;padding:46px 26px!important}
.hero h1{font-size:36px}.hero p{font-size:18px;max-width:620px;margin:10px auto}
.luck{display:inline-block;margin-top:14px;font-size:22px;font-weight:700;color:#fff;background:var(--p);border-radius:16px;padding:10px 26px}
.qnum{font-size:13px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--mut)}
.sq{font-size:30px;font-weight:600;line-height:1.35;margin:12px 0 4px}
.listen{font-size:20px;color:var(--mut);margin:18px 0 6px}
.story{font-size:17px;background:#fffaf0;border-left:5px solid var(--cpic);border-radius:12px;padding:12px 16px;margin:0 0 14px}
.album{width:100%;border-radius:14px;display:block;border:1px solid var(--line)}
.pgs{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:12px}
.rtext h2{color:var(--cread)}.rtext p{font-size:19px;line-height:1.65;margin:0 0 12px}
.rtext.small p{font-size:15.5px;line-height:1.55}
.qbox{border:2px solid var(--cread);border-radius:16px;padding:14px 18px;margin-bottom:16px;background:#fff}
.wq{border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px;background:#fff}
.wq p{font-weight:600;margin:0 0 8px;font-size:17px}
.opt{display:block;width:100%;text-align:left;border:1.5px solid #d9cfe8;background:#fff;border-radius:12px;padding:10px 14px;margin:6px 0;font-size:16px;color:var(--ink)}
.opt b{color:var(--cw);margin-right:8px}.opt.sel{background:var(--cw);border-color:var(--cw);color:#fff}.opt.sel b{color:#fff}.opt:disabled{cursor:default}
.wq textarea{font-size:16px}
.endh{font-size:40px!important}
.wd{cursor:pointer;border-radius:5px;padding:0 1px}.wd:hover{background:var(--pl)}.wd.bad{background:var(--nol);color:var(--no);text-decoration:underline wavy}
.vtap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(42,26,74,.55);z-index:2}.vtap button{font-size:20px}
.vctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#f1f7ea;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.vid{position:relative;width:100%;padding-top:56.25%;border-radius:14px;overflow:hidden;background:#000;margin:0 0 14px}.vid iframe,.vid video{position:absolute;inset:0;width:100%;height:100%;border:0}
</style>
</head>

function embedHtml(u) {

const cleanW = w => w.replace(/^[^A-Za-z0-9']+|[^A-Za-z0-9']+$/g, '');
function readWords(R) { const rw = R.rw || {}; return Object.keys(rw).sort((a, b) => { const [p1, w1] = a.split('-').map(Number), [p2, w2] = b.split('-').map(Number); return p1 - p2 || w1 - w2; }).map(k => rw[k]).filter((w, i, a) => a.indexOf(w) === i); }
function newCode() { const a = 'abcdefghjkmnpqrstuvwxyz23456789'; let s = ''; for (let i = 0; i < 5; i++) s += a[Math.floor(Math.random() * a.length)]; return s; }

/* ================= FIREBASE (REST + SSE) ================= */
const url = p => `${DB}/aulas/${p}.json`;
let queue = JSON.parse(localStorage.getItem('po_q') || '[]');
const saveQ = () => localStorage.setItem('po_q', JSON.stringify(queue));
function send(method, path, body) { queue.push({ method, path, body }); saveQ(); flush(); }
let flushing = false;
async function flush() {
  if (flushing) return; flushing = true;
  while (queue.length) {
    const j = queue[0];
    try { const r = await fetch(url(j.path), { method: j.method, body: JSON.stringify(j.body ?? null) }); if (!r.ok) throw 0; queue.shift(); saveQ(); net(false); }
    catch (e) { net(true); await new Promise(r => setTimeout(r, 2500)); }
  }
  flushing = false;
}
async function get(path) { const r = await fetch(url(path)); if (!r.ok) throw new Error('get'); return await r.json(); }
function net(bad) { $('#net').style.display = bad ? 'block' : 'none'; }
function setIn(obj, path, data, merge) {
  const parts = path.split('/').filter(Boolean);
  if (!parts.length) { if (merge) { Object.assign(obj, data); for (const k in data) if (data[k] === null) delete obj[k]; return obj; } return data && typeof data === 'object' ? data : {}; }
  let o = obj; for (let i = 0; i < parts.length - 1; i++) { if (typeof o[parts[i]] !== 'object' || o[parts[i]] === null) o[parts[i]] = {}; o = o[parts[i]]; }
  const k = parts[parts.length - 1];
  if (merge) { o[k] = Object.assign(typeof o[k] === 'object' && o[k] ? o[k] : {}, data); for (const x in data) if (data[x] === null) delete o[k][x]; }
  else if (data === null || data === undefined) delete o[k]; else o[k] = data;
  return obj;
}
function listen(path, holder, onChange) {
  const es = new EventSource(url(path));
  es.addEventListener('put', e => { const d = JSON.parse(e.data); holder.v = setIn(holder.v || {}, d.path, d.data, false); onChange(); });
  es.addEventListener('patch', e => { const d = JSON.parse(e.data); holder.v = setIn(holder.v || {}, d.path, d.data, true); onChange(); });
  es.onerror = () => net(true); es.onopen = () => { if (!queue.length) net(false); };
  return es;
}

/* ================= SCORING ================= */
const VAL = { ok: 1, half: .5, no: 0, skip: 0 };
function finalMark(R, key) { const m2 = (R.m2 || {})[key]; if (m2) return m2; return (R.m || {})[key] || ''; }
function calc(E, R) {
  const m = R.m || {};
  const nQ = E.perguntas.length, nR = E.reading ? E.reading.perguntas.length : 0, L = E.listening, nW = L ? L.itens.length : 0;
  let q = { ok: 0, half: 0, no: 0, skip: 0, pend: 0, pts: 0 };
  for (let i = 0; i < nQ; i++) { const v = finalMark(R, 'q' + i); if (!v) q.pend++; else { q[v]++; q.pts += VAL[v]; } }
  let r = { ok: 0, half: 0, no: 0, pend: 0, pts: 0 };
  for (let i = 0; i < nR; i++) { const v = m['r' + i]; if (!v) r.pend++; else { r[v]++; r.pts += VAL[v]; } }
  let w = { ok: 0, pend: 0, pts: 0 };
  if (L) L.itens.forEach((it, i) => {
    if (it.op) { const a = (R.w || {})[i]; if (a === undefined || a === null || a === '') w.pend++; else if (+a === it.c) { w.ok++; w.pts++; } }
    else { const v = m['w' + i]; if (!v) w.pend++; else { w.pts += VAL[v]; if (v === 'ok') w.ok++; } }
  });
  const total = nQ + nR + nW, pts = q.pts + r.pts + w.pts;
  const itens = total ? pts / total * 100 : 0;
  const cv = Object.values(R.c || {}).filter(x => x !== null && x !== undefined);
  const crit = cv.length ? cv.reduce((a, b) => a + b, 0) / cv.length : 0;
  const final = Math.round((itens * PESO_ITENS + crit * PESO_CRIT) * 10) / 10;
  const help = Object.keys(R.h || {}).filter(k => R.h[k]).length;
  const retried = (R.retry || []).length;
  return { nQ, nR, nW, q, r, w, total, pts, itens, crit, critN: cv.length, final, help, retried };
}

/* ================= FEEDBACK (rascunho automático) ================= */
function lista(arr) { if (arr.length <= 1) return arr.join(''); return arr.slice(0, -1).join('; ') + '; e ' + arr[arr.length - 1]; }
const EXT = ['zero', 'uma', 'duas', 'três', 'quatro', 'cinco', 'seis', 'sete', 'oito', 'nove', 'dez'];
const ext = n => n <= 10 ? EXT[n] : String(n);
const Ext = n => { const t = ext(n); return t.charAt(0).toUpperCase() + t.slice(1); };
function draftFeedback(E, R) {
  const s = calc(E, R), nome = R.aluno.nome;
  const p = [];
  p.push(`${nome} fez a prova oral de ${E.nome} (${E.livro}) em ${dataBR(R.data)}, com a professora ${R.prof}, e obteve ${pct(s.final)}.`);
  let a = `Nas perguntas de vocabulário e gramática, respondeu bem a ${s.q.ok} de ${s.nQ}`;
  if (s.q.half) a += ` e respondeu parcialmente a ${s.q.half}`;
  a += '.';
  if (s.retried) a += ` ${s.retried === 1 ? 'Uma pergunta foi deixada' : Ext(s.retried) + ' perguntas foram deixadas'} para o final e ${s.retried === 1 ? 'retomada' : 'retomadas'} em uma segunda tentativa.`;
  p.push(a);
  const rws = readWords(R);
  if (E.reading && rws.length) p.push(`Na leitura em voz alta, precisa praticar a pronúncia de: ${rws.join(', ')}.`);
  if (E.reading) p.push(`Na leitura do texto "${E.reading.titulo}", respondeu corretamente a ${s.r.ok} de ${s.nR} perguntas de compreensão${s.r.half ? ` (e parcialmente a ${s.r.half})` : ''}.`);
  if (E.listening) p.push(`No ${E.listening.tipo.toLowerCase()}, acertou ${s.w.ok} de ${s.nW} questões.`);
  const c = R.c || {};
  const fortes = CRITERIOS.filter((t, i) => c[i] >= 75).map(t => t.charAt(0).toLowerCase() + t.slice(1));
  const fracos = CRITERIOS.filter((t, i) => c[i] !== undefined && c[i] !== null && c[i] <= 25).map(t => t.charAt(0).toLowerCase() + t.slice(1));
  const medios = CRITERIOS.filter((t, i) => c[i] === 50).map(t => t.charAt(0).toLowerCase() + t.slice(1));
  if (fortes.length) p.push(`Pontos fortes: ${lista(fortes)}.`);
  const dev = fracos.concat(medios);
  if (dev.length) p.push(`Pontos a desenvolver: ${lista(dev)}.`);
  if (s.help) p.push(`Em ${s.help === 1 ? 'uma pergunta' : ext(s.help) + ' perguntas'}, ${nome} precisou de apoio e viu a pergunta escrita na tela para compreendê-la.`);
  else p.push(`${nome} respondeu sem precisar ver as perguntas escritas na tela.`);
  const g = ((R.n || {}).geral || '').trim();
  if (g) p.push(g);
  return p.join('\n\n');
}

/* ================= TEACHER RUNNER ================= */
let codeOpen = false;
let R = null, E = null, RID = null, LIVE = { v: {} }, liveES = null, STEPS = [];
function buildSteps() {
  const s = [{ k: 'welcome', t: 'Início' }];
  E.perguntas.forEach((q, i) => s.push({ k: 'q', i, t: `Pergunta ${i + 1}`, sec: 'q' }));
  (R.retry || []).forEach(i => s.push({ k: 'retry', i, t: `Nova tentativa · ${i + 1}`, sec: 'q' }));
  if (E.picture) s.push({ k: 'pic', t: 'Picture', sec: 'pic' });
  if (E.reading) { s.push({ k: 'read', t: 'Reading · leitura', sec: 'read' }); E.reading.perguntas.forEach((q, i) => s.push({ k: 'rq', i, t: `Reading · pergunta ${i + 1}`, sec: 'read' })); }
  if (E.listening) s.push({ k: 'watch', t: E.listening.tipo, sec: 'w' });
  s.push({ k: 'end', t: 'Encerrar para o aluno' });
  s.push({ k: 'crit', t: 'Critérios', sec: 'crit' });
  s.push({ k: 'report', t: 'Nota e feedback', sec: 'crit' });
  STEPS = s;
}
function setR(path, val) { R = setIn(R, path, val, false); send('PUT', `${ROOT}/r/${RID}/${path}`, val ?? null); R.upd = Date.now(); send('PUT', `${ROOT}/r/${RID}/upd`, R.upd); }
function setL(path, val) { LIVE.v = setIn(LIVE.v || {}, path, val, false); send('PUT', `po-${R.code}/${path}`, val ?? null); }
async function runner(id) {
  app.innerHTML = `<div class="wrap"><p class="mut">Carregando…</p></div>`;
  RID = id;
  R = null;
  for (let k = 0; k < 4 && !R; k++) { try { R = await get(`${ROOT}/r/${id}`); } catch (e) { R = null; } if (!R) R = ALL[id]; if (!R) await new Promise(r => setTimeout(r, 1000)); }
  if (!R) { app.innerHTML = `<div class="wrap"><div class="card">Prova não encontrada. <a href="#/">Voltar</a></div></div>`; return; }
  E = exam(R.exam);
  ['m', 'm2', 'h', 'n', 'c', 'w', 'rw'].forEach(k => R[k] = R[k] || {});
  setTtl(`${E.nome} · ${E.semestre} · ${R.aluno.nome}`, 'Oral Exam');
  buildSteps();
  if (liveES) liveES.close();
  LIVE = { v: {} };
  liveES = listen(`po-${R.code}`, LIVE, onLive);
  if (R.status !== 'andamento' && (R.step || 0) < STEPS.length - 2) R.step = STEPS.findIndex(s => s.k === 'report');
  codeOpen = !R.step;
  renderRun();
  clearInterval(runner.t); runner.t = setInterval(renderSide, 5000);
}
function onLive() {
  const wa = LIVE.v.wa || {};
  let ch = false;
  if (E.listening) E.listening.itens.forEach((it, i) => { const a = wa[i]; const cur = R.w[i]; if (a !== undefined && a !== null && String(a) !== String(cur ?? '')) { R.w[i] = a; ch = true; } });
  if (ch) setR('w', R.w);
  renderSide();
  if (STEPS[R.step] && STEPS[R.step].k === 'watch') renderMainWatchLive();
}
function cur() { return STEPS[Math.min(R.step || 0, STEPS.length - 1)]; }
function studentViewFor(st) {
  if (['crit', 'report'].includes(st.k)) return { k: 'end' };
  const v = { k: st.k };
  if ('i' in st) v.i = st.i;
  if (st.k === 'q' || st.k === 'retry') v.show = !!R.h['q' + st.i];
  if (st.k === 'rq') v.show = !!R.h['r' + st.i];
  if (st.k === 'pic') v.page = (LIVE.v.v && LIVE.v.v.page) || 0;
  return v;
}
function go(i) {
  i = Math.max(0, Math.min(STEPS.length - 1, i));
  const from = cur();
  if (from.k === 'q' && from.i === E.perguntas.length - 1 && i > R.step && !R.retryDone) {
    const skipped = E.perguntas.map((q, j) => j).filter(j => R.m['q' + j] === 'skip');
    if (skipped.length) { setR('retry', skipped); setR('retryDone', true); buildSteps(); }
    else setR('retryDone', true);
  }
  if (from.k === 'watch' && i > R.step) setL('wlock', true);
  setR('step', i);
  const st = cur();
  if (R.status === 'andamento' && st.k !== 'end') setL('v', studentViewFor(st));
  codeOpen = i === 0;
  renderRun(); window.scrollTo(0, 0);

let lastSig = '';
function studentRender() {
  const L = SL.v;
  if (!L || !L.exam) { app.innerHTML = `<div class="st narrow"><div class="card center"><h2>Code not found</h2><p class="mut">Check the code with your teacher.</p><a class="btn" href="${BASE}?aluno=1" style="text-decoration:none;display:inline-block">Try again</a></div></div>`; return; }
  const Ex = exam(L.exam); if (!Ex) return;
  const v = L.v || { k: 'welcome' };
  const sig = JSON.stringify([v, L.wa, L.wlock, L.vid, L.vc, L.vfree, L.wt && v.k === 'watch' ? 1 : 0]);
  if (sig === lastSig) return; lastSig = sig;
  const active = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.wt;
  if (active !== undefined && v.k === 'watch') return; // não redesenhar enquanto o aluno digita
  setTtl(`${Ex.nome} · ${Ex.semestre}`, 'Oral Exam');
  let h = '';
  if (v.k === 'welcome') {
    h = `<div class="card hero"><div class="sec c-p" style="justify-content:center">Oral Exam</div><h1>Welcome to your Oral Exam${L.aluno ? ', ' + esc(L.aluno) : ''}!</h1><p>${esc(Ex.intro || DEF_INTRO)}</p><div class="luck">Good luck!</div></div>`;
  } else if (v.k === 'q' || v.k === 'retry') {
    h = `<div class="card"><div class="sec c-q">Questions</div><div class="qnum">${v.k === 'retry' ? "Let's try this one again" : `Question ${v.i + 1} of ${Ex.perguntas.length}`}</div>
      ${v.show ? `<div class="sq">${esc(Ex.perguntas[v.i])}</div>` : `<div class="listen">Listen to your teacher's question.</div>`}</div>`;
  } else if (v.k === 'pic') {
    const pg = v.page || 0, n = Ex.picture.imgs.length;
    h = `<div class="card"><div class="sec c-pic">Picture</div><div class="story">${esc(Ex.picture.backstory)}</div>
      <img class="album" src="${Ex.picture.imgs[pg]}" alt="Photo album page ${pg + 1}">
      <div class="pgs"><button class="btn sm sec2" data-p="-1" ${pg ? '' : 'disabled'}>Previous</button><span class="mut">Page ${pg + 1} of ${n}</span><button class="btn sm sec2" data-p="1" ${pg < n - 1 ? '' : 'disabled'}>Next</button></div></div>`;
  } else if (v.k === 'read' || v.k === 'rq') {
    const q = v.k === 'rq' ? `<div class="qbox"><div class="qnum">Question ${v.i + 1} of ${Ex.reading.perguntas.length}</div>${v.show ? `<div class="sq" style="font-size:24px">${esc(Ex.reading.perguntas[v.i][0])}</div>` : `<div class="listen" style="margin:8px 0 0">Listen to your teacher's question.</div>`}</div>` : '';
    h = `<div class="card"><div class="sec c-read">Reading</div>${v.k === 'read' ? '<p class="mut">Read the text aloud.</p>' : ''}${q}
      <div class="rtext ${v.k === 'rq' ? 'small' : ''}"><h2>${esc(Ex.reading.titulo)}</h2>${Ex.reading.texto.map(p => `<p>${esc(p)}</p>`).join('')}</div></div>`;
  } else if (v.k === 'watch') {
    return studentWatch(Ex, L);
  } else if (v.k === 'watch_old') {
    const Lx = Ex.listening, wa = L.wa || {}, lk = !!L.wlock;
    h = `<div class="card"><div class="sec c-w">${esc(Lx.tipo)}</div><p style="font-weight:600">${esc(Lx.instrucao)}</p>
      ${Lx.itens.map((it, i) => `<div class="wq"><p>${i + 1}. ${esc(it.q)}</p>${it.op ? it.op.map((o, j) => `<button class="opt ${String(wa[i]) === String(j) ? 'sel' : ''}" data-q="${i}" data-o="${j}" ${lk ? 'disabled' : ''}><b>${L3[j]}</b>${esc(o)}</button>`).join('') : `<textarea data-wt="${i}" ${lk ? 'disabled' : ''}>${esc((L.wt || {})[i] || '')}</textarea>`}</div>`).join('')}
      ${lk ? '<p class="mut center">Your answers were sent to your teacher.</p>' : ''}</div>`;
  } else if (v.k === 'end') {
    h = `<div class="card hero"><h1 class="endh">You did it!</h1><p>Thank you for your hard work this semester. Your teacher is very proud of you.</p><div class="luck">Have a great vacation!</div><p style="margin-top:18px">See you next semester!</p></div>`;
  }
  stopVideo();
  app.innerHTML = `<div class="st">${h}</div>`;
  app.querySelectorAll('[data-o]').forEach(b => b.onclick = () => { if (SL.v.wlock) return; SL.v = setIn(SL.v, 'wa/' + b.dataset.q, +b.dataset.o, false); send('PUT', `po-${myCode}/wa/${b.dataset.q}`, +b.dataset.o); studentRender(); });
  app.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { const np = Math.max(0, (v.page || 0) + +b.dataset.p); SL.v = setIn(SL.v, 'v/page', np, false); send('PUT', `po-${myCode}/v/page`, np); studentRender(); });
  app.querySelectorAll('[data-wt]').forEach(t => t.oninput = () => { clearTimeout(t._t); t._t = setTimeout(() => { SL.v = setIn(SL.v, 'wt/' + t.dataset.wt, t.value, false); send('PUT', `po-${myCode}/wt/${t.dataset.wt}`, t.value); }, 500); });
}

/* ---- watching do aluno: player controlado pela professora ---- */
let VID = null, VIFR = null, vLastN = null, vErr = 0, vTimer = null;
function stopVideo() { if (VID) { try { VID.pause(); } catch (e) { } } VID = null; VIFR = null; vLastN = null; clearInterval(vTimer); vTimer = null; }
let WQI = 0;
function studentWatch(Ex, L) {
  const Lx = Ex.listening, wa = L.wa || {}, lk = !!L.wlock, n = Lx.itens.length;
  if (!$('#wqs')) {
    stopVideo(); WQI = 0;
    app.innerHTML = `<div class="st wide"><div class="card"><div class="sec c-w">${esc(Lx.tipo)}</div><p style="font-weight:600;margin-top:0">${esc(Lx.instrucao)}</p><div class="wlay" id="wlay"><div id="vbox"></div><div id="wqs"></div></div></div></div>`;
    setupVideo(Lx);
  }
  const showV = !!Lx.video && L.vid !== false;
  const vb = $('#vbox'); if (vb) vb.style.display = showV ? '' : 'none';
  $('#wlay').classList.toggle('nov', !showV);
  if (VID) { VID.controls = !!L.vfree; if (!showV) VID.pause(); else applyCmd(L.vc); }
  WQI = Math.max(0, Math.min(n - 1, WQI));
  const it = Lx.itens[WQI], i = WQI;
  const answered = k => { const a = it.op ? wa[k] : (L.wt || {})[k]; return Lx.itens[k].op ? (wa[k] !== undefined && wa[k] !== null && wa[k] !== '') : !!((L.wt || {})[k] || '').trim(); };
  $('#wqs').innerHTML = `<div class="wq" style="margin:0">
      <div class="wnav"><button class="btn sm sec2" data-wn="-1" ${i ? '' : 'disabled'} aria-label="Previous">&#8249;</button><span class="qnum">Question ${i + 1} of ${n}</span><button class="btn sm sec2" data-wn="1" ${i < n - 1 ? '' : 'disabled'} aria-label="Next">&#8250;</button></div>
      <p style="margin-top:12px">${esc(it.q)}</p>
      ${it.op ? it.op.map((o, j) => `<button class="opt ${String(wa[i]) === String(j) ? 'sel' : ''}" data-q="${i}" data-o="${j}" ${lk ? 'disabled' : ''}><b>${L3[j]}</b>${esc(o)}</button>`).join('') : `<textarea data-wt="${i}" ${lk ? 'disabled' : ''}>${esc((L.wt || {})[i] || '')}</textarea>`}
      <div class="wdots">${Lx.itens.map((x, k) => `<button data-wj="${k}" class="${answered(k) ? 'ans' : ''} ${k === i ? 'cur' : ''}">${k + 1}</button>`).join('')}</div>
    </div>${lk ? '<p class="mut center">Your answers were sent to your teacher.</p>' : ''}`;
  const goQ = k => { WQI = Math.max(0, Math.min(n - 1, k)); lastSig = ''; studentRender(); report(); };
  app.querySelectorAll('[data-wn]').forEach(b => b.onclick = () => goQ(WQI + +b.dataset.wn));
  app.querySelectorAll('[data-wj]').forEach(b => b.onclick = () => goQ(+b.dataset.wj));
  app.querySelectorAll('[data-o]').forEach(b => b.onclick = () => { if (SL.v.wlock) return; SL.v = setIn(SL.v, 'wa/' + b.dataset.q, +b.dataset.o, false); send('PUT', `po-${myCode}/wa/${b.dataset.q}`, +b.dataset.o); lastSig = ''; studentRender(); if (WQI < n - 1) setTimeout(() => goQ(WQI + 1), 350); });
  app.querySelectorAll('[data-wt]').forEach(t => t.oninput = () => { clearTimeout(t._t); t._t = setTimeout(() => { SL.v = setIn(SL.v, 'wt/' + t.dataset.wt, t.value, false); send('PUT', `po-${myCode}/wt/${t.dataset.wt}`, t.value); }, 500); });
}
function setupVideo(Lx) {
  const vb = $('#vbox'); if (!vb || !Lx.video) return;
  const src = videoSrc(Lx.video);
  if (!src) { vb.innerHTML = embedHtml(Lx.video); vErr = 0; return; }
  vb.innerHTML = `<div class="vid"><video playsinline preload="auto"></video><div class="vtap" id="vtap" style="display:none"><button class="btn">Tap to start the video</button></div></div>`;
  VID = vb.querySelector('video'); vErr = 0;
  VID.src = src;
  VID.addEventListener('error', () => { vErr = 1; VID = null; vb.innerHTML = embedHtml(Lx.video); report(); });
  ['play', 'pause', 'seeked', 'loadedmetadata', 'ended'].forEach(ev => VID && VID.addEventListener(ev, report));
  $('#vtap').onclick = () => { $('#vtap').style.display = 'none'; vErr = 0; if (VID) VID.play().catch(() => { }); };
  clearInterval(vTimer); vTimer = setInterval(report, 2000); report();
}
function applyCmd(vc) {
  if (!VID || !vc || vc.n === vLastN) return; vLastN = vc.n;
  if (typeof vc.t === 'number') { try { VID.currentTime = vc.t; } catch (e) { } }
  if (vc.cmd === 'play') VID.play().then(() => { vErr = 0; }).catch(() => { vErr = 2; const tp = $('#vtap'); if (tp) tp.style.display = 'flex'; report(); });
  else if (vc.cmd === 'pause') VID.pause();
}
function report() {
  const x = { at: Date.now(), e: vErr, q: WQI, hd: document.hidden ? 1 : 0 };
  if (VID) { x.t = Math.round(VID.currentTime || 0); x.p = !VID.paused && !VID.ended; x.en = VID.ended ? 1 : 0; if (isFinite(VID.duration)) x.d = Math.round(VID.duration); }
  send('PUT', `po-${myCode}/vs`, x);
}

document.addEventListener('visibilitychange', () => { if (STUDENT && myCode && document.querySelector('#wqs')) report(); });
route();
</script>
</body>
