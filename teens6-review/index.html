<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teens 6 · Exam Review · Educa&amp;Cia</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{--p:#583F84;--p2:#7B62A8;--pl:#F3EFF9;--o:#E0703A;--g:#2E8B57;--r:#C8433A;--ink:#2A2238;--mut:#6E6680;--line:#E4DDEF;--gold:#E8B630}
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,system-ui,sans-serif;color:var(--ink);background:#FAF8FD;font-size:15px;line-height:1.5}
button{font-family:inherit;cursor:pointer}
.top{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:10px 18px;position:sticky;top:0;z-index:20}
.logo{display:flex;align-items:center;gap:10px}.logo .li{height:42px}.logo .lw{height:22px;display:block}.logo small{color:var(--mut);font-size:12px;display:block;margin-top:2px}
.coins{position:relative;display:flex;align-items:center;gap:6px;background:#FFF7DC;border:1px solid #F1DB8C;border-radius:30px;padding:5px 14px 5px 8px;font-size:18px}
.coins b{color:#8A6510}.coin{flex:none;vertical-align:middle}
.float{position:absolute;right:6px;top:-6px;font-weight:700;font-size:16px;animation:fl 1.2s ease-out forwards;pointer-events:none}
.float.up{color:#B8860B}.float.down{color:var(--r)}
@keyframes fl{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
.tabs{display:flex;gap:6px;padding:10px 18px 0;max-width:1000px;margin:0 auto;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;border-radius:22px;padding:7px 16px;font-weight:500;color:var(--p)}
.tab.on{background:var(--p);color:#fff;border-color:var(--p)}
.badge{background:var(--o);color:#fff;border-radius:10px;padding:0 7px;margin-left:6px;font-size:12px}
.wrap{max-width:1000px;margin:0 auto;padding:16px 18px 60px}.wrap.narrow{max-width:520px}
.intro h1{color:var(--p);margin:6px 0 2px;font-size:26px}.intro p{margin:0 0 14px;color:var(--mut)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.hero h1{color:var(--p);margin-top:0}
.muted{color:var(--mut)}.sm{font-size:13px}.center{text-align:center;justify-content:center}.nowrap{white-space:nowrap}.hide{display:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}.between{justify-content:space-between}
.lbl{display:block;font-weight:600;color:var(--p);margin:12px 0 4px;font-size:14px}
.inp,.sel{font-family:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;background:#fff;color:var(--ink)}
.inp:focus,.sel:focus,.gin:focus,.wtext:focus{outline:none;border-color:var(--p2);box-shadow:0 0 0 3px #E6DDF5}
.inp.sm{padding:5px 10px;font-size:13px;width:200px}.w{width:100%}
.btn{background:var(--p);color:#fff;border:0;border-radius:24px;padding:9px 20px;font-weight:600;font-size:14px}
.btn:hover{background:var(--p2)}.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:#fff;color:var(--p);border:1.5px solid var(--line)}.btn.sm{padding:6px 14px;font-size:13px}
.link{background:none;border:0;color:var(--p);padding:0;font-weight:500}.link.b{font-weight:600;text-decoration:underline}
.mini{border:1px solid #F1DB8C;background:#FFF7DC;color:#7A5A0C;border-radius:14px;padding:3px 10px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.mini .coin{width:15px;height:15px}.mini.ghost{background:#fff;border-color:var(--line);color:var(--mut)}.mini.tch{background:#E9F6EE;border-color:#BFE3CC;color:var(--g)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.mcard{text-align:left;background:#fff;border:1px solid var(--line);border-left:6px solid var(--c);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--ink);transition:transform .12s}
button.mcard:hover{transform:translateY(-2px);box-shadow:0 6px 18px #583F8414}
.mcard b{font-size:18px;color:var(--c)}.mcard small{color:var(--mut)}.mn{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:600}
.mcard.dn{opacity:.75}.mp{font-size:12px;color:var(--mut)}
.bar{display:block;height:7px;background:#EEE9F5;border-radius:5px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--c,var(--p))}
.bar.sm{display:inline-block;width:70px;vertical-align:middle;margin:0 4px 0 0}
.sethead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:4px 0 12px}.sethead h2{margin:0;color:var(--c);font-size:22px}
.x2{background:#FFF1C7;color:#8A6510;border-radius:10px;padding:2px 8px;font-size:12px;vertical-align:middle}
.pills{display:flex;gap:5px;flex-wrap:wrap;margin-left:auto}
.pill{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);background:#fff;color:var(--mut);font-weight:600;font-size:13px}
.pill.part{border-color:var(--c);color:var(--c)}.pill.full{background:#E9F6EE;border-color:#9CD4B2;color:var(--g)}.pill.on{background:var(--c);border-color:var(--c);color:#fff}
.step{border-top:5px solid var(--c)}.stitle h3{margin:0 0 6px;font-size:20px}.sn{font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.ent{background:var(--pl);border-radius:14px;padding:4px 14px;margin:8px 0 12px}.ent summary{font-weight:700;color:var(--p);cursor:pointer;padding:6px 0}.ent div{padding:0 0 10px;font-size:14px}
.ins{font-weight:600;margin:6px 0 12px}
.nav{display:flex;justify-content:space-between;margin-top:6px}
.wgroup h4{margin:12px 0 6px;color:var(--p)}.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:7px 12px;display:flex;align-items:center;gap:6px;color:var(--ink);font-size:14px}
.chip svg{color:var(--p2)}.chip small{color:var(--o);font-weight:500}.chip.on{border-color:var(--o);background:#FFF5EF}
.clist,.tlist{padding-left:22px;margin:0}.clist li,.tlist li{margin:0 0 14px;padding:6px 8px;border-radius:12px}
.cq{margin:0 0 6px}.blank{color:var(--p);font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:6px 12px;font-size:14px;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--p2)}.opt:disabled{cursor:default}
.opt.sel{border-color:var(--p);background:var(--pl)}.opt.right{border-color:var(--g);background:#E9F6EE;color:#1E6B40;font-weight:600}.opt.wrong{border-color:var(--r);background:#FDECEA;color:var(--r);text-decoration:line-through}
.tools{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mk{font-weight:700;font-size:14px}.mk.ok{color:var(--g)}.mk.bad{color:var(--r)}.mk.sh{color:var(--mut);font-size:12px;font-weight:500}.mk.rt{color:var(--o);font-size:12px}
.key{font-size:12px;background:#E9F6EE;color:#1E6B40;border-radius:8px;padding:2px 8px}
li.s-ok{background:#F4FBF6}li.s-bad{background:#FFF4F2}
.tq{display:block;margin-bottom:4px}.tin{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.tin .inp{flex:1;min-width:200px}
.s-ok .inp,.gapw.s-ok .gin{border-color:#9CD4B2;background:#F4FBF6;color:#1E6B40}
.s-bad .inp,.gapw.s-bad .gin{border-color:#E9A39C;background:#FFF4F2;color:var(--r)}
.s-shown .inp,.gapw.s-shown .gin{border-color:#ccc;background:#F5F5F5;color:#555}
.s-retry .inp,.gapw.s-retry .gin{border-color:var(--o)}
.bank{display:flex;flex-wrap:wrap;gap:6px;border:1.5px dashed #CFC2E4;border-radius:14px;padding:10px;margin-bottom:14px;background:#FCFAFF}
.bank span{background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px 10px;font-size:14px;font-weight:500;color:var(--p)}
.gaptext{line-height:2.5;font-size:15.5px}
.gapw{white-space:nowrap}.gapw sup{color:var(--p2);font-weight:700;margin-right:2px}
.gin{font-family:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:9px;padding:2px 8px;min-width:6ch}
.gtools{margin-top:10px;display:flex;flex-direction:column;gap:6px}.gtool{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px}
.sort{display:flex;flex-direction:column;gap:6px}
.srow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 10px;border-radius:12px;border:1px solid #F0EBF6}
.srow.s-ok{background:#F4FBF6}.srow.s-bad{background:#FFF4F2}.sw{min-width:220px;font-weight:500;flex:1}
.olist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.olist li{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 10px;border:1px solid #F0EBF6;border-radius:12px}
.olist li span{flex:1;min-width:200px}
.checkbar{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid #F0EBF6}.sp{flex:1}
.audio{background:#F7F4FB;border-radius:14px;padding:12px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.script{flex-basis:100%;background:#fff;border-radius:10px;padding:8px 12px;font-size:14px}.script p{margin:4px 0}
.readwrap{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}
.text{background:#FCFAFF;border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:14.5px;max-height:620px;overflow:auto}
.text h4{margin:0;color:var(--p);font-size:18px}.text .by{margin:0 0 8px;color:var(--mut);font-size:13px}
.speak{display:flex;flex-direction:column;gap:6px}
.bigcard{font-size:21px;font-weight:600;color:var(--p);background:linear-gradient(135deg,#F3EFF9,#FFF5EF);border-radius:18px;padding:30px 24px;text-align:center;min-height:120px;display:flex;align-items:center;justify-content:center}
.bigcard.muted{color:var(--mut);font-weight:500;font-size:17px}
.tbox{background:#E9F6EE;border:1px solid #BFE3CC;border-radius:14px;padding:12px;margin-top:14px;font-size:14px}.tbox ol{margin:6px 0 0}
.check{background:#FCFAFF;border-radius:12px;padding:10px 14px 10px 30px;font-size:14px;margin:0 0 10px}
.wtext{width:100%;min-height:240px;font-family:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:14px;padding:12px;line-height:1.6}
.wtext.sm{min-height:90px;margin-top:6px}
.fb{background:#FFF5EF;border-radius:14px;padding:10px 14px;margin-top:12px}.fb p{margin:4px 0 0;white-space:pre-wrap}
.msg{background:#FFF5EF;border-bottom:1px solid #F5D3BF;padding:10px 18px;text-align:center}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 18px;display:flex;flex-direction:column;align-items:center;min-width:140px}
.stat b{font-size:26px;color:var(--p)}.stat small{color:var(--mut)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th{text-align:left;color:var(--p);font-weight:600;border-bottom:2px solid var(--line);padding:8px 6px}
.tbl td{border-bottom:1px solid #F0EBF6;padding:8px 6px;vertical-align:middle}.ok{color:var(--g)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#D5CFDF}.dot.on{background:#3BB273;box-shadow:0 0 0 3px #3BB27333}
.tbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#E9F6EE;border-bottom:1px solid #BFE3CC;padding:10px 18px;font-size:14px;position:sticky;top:63px;z-index:15}
.grp{display:inline-flex;gap:4px;align-items:center}
.notes h3{color:var(--p);margin:14px 0 6px}.notes h4{color:var(--o);margin:18px 0 6px}.krow{font-size:14px;margin:6px 0 10px}.krow ol{margin:2px 0 0}
.hwrow .chips{margin-top:10px}.hwrow .chip.on{border-color:#9CD4B2;background:#E9F6EE}
#net{display:none;position:fixed;bottom:12px;left:12px;background:#FDECEA;color:var(--r);border-radius:12px;padding:6px 12px;font-size:13px;z-index:50}
#toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,20px);background:var(--ink);color:#fff;border-radius:14px;padding:10px 16px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:60;display:flex;gap:6px;align-items:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:760px){.readwrap{grid-template-columns:1fr}.text{max-height:none}.logo .li{height:34px}.logo .lw{height:18px}.sw{min-width:140px}.tbar{top:55px;position:static}.pills{margin-left:0}}
.mcard.final{background:linear-gradient(135deg,#fff,#F3EFF9);border-left-width:8px}

    { id: 'm1c', type: 'gap', t: 'Dad’s bedroom in 1995',
      ent: '<b>there was / there were</b> = havia, tinha (no passado). Use <b>was</b> com singular ou incontável (<i>there was a TV, there was some music</i>) e <b>were</b> com plural (<i>there were some posters</i>). Negativa: <b>there wasn’t / there weren’t</b>.<br><b>Possessive adjectives</b>: my, your, his, her, its, our, their — vêm <u>antes</u> do substantivo (<i>their beds</i>). <b>its</b> (sem apóstrofo) = dele/dela para coisas e animais.<br>Atenção ao <b>Simple Past</b>: regulares com <b>-ed</b>, irregulares têm forma própria e a negativa é <b>didn’t + verbo base</b>.',
      ins: 'Complete the text. Use the words in the box (you can use them more than once) or the Simple Past of the verbs in brackets.',

    { id: 'm2b', type: 'choose', t: 'Live from the tech fair',
      ent: '<b>Present Simple</b>: rotina, hábitos, fatos (<i>I usually film at home. The fair opens at 9.</i>) — palavras como <i>usually, every Sunday, twice a day</i>.<br><b>Present Continuous</b>: o que está acontecendo <u>agora</u> ou neste período (<i>Right now I’m standing… Look! It’s making coffee.</i>).<br><b>State verbs</b> (know, like, hate, want, need, mean, believe, understand, seem, cost, belong…) <u>não</u> vão para o -ing, mesmo falando de agora: <i>I need a charger</i>, não <s>I’m needing</s>.',

        { q: 'Shh! The presenter ___ about the new phone.', o: ['is talking','talks'], a: 0 }
      ] },
    { id: 'm2c', type: 'choose', t: 'Two meanings',
      ent: 'Alguns verbos são <b>state verbs</b> num sentido e <b>ação</b> em outro:<br><b>think</b>: <i>I think it’s great</i> (opinião) × <i>I’m thinking about it</i> (estou pensando, processo).<br><b>have</b>: <i>She has a laptop</i> (posse) × <i>We’re having lunch</i> (comendo, ação).<br><b>taste</b>: <i>It tastes salty</i> (tem gosto de) × <i>The chef is tasting the sauce</i> (está provando, ação).',
      ins: 'State or action? Choose the correct form.',
      items: [
        { q: 'Wait a minute, I ___ about my next video.', o: ['’m thinking','think'], a: 0 },

    { id: 'm2d', type: 'sort', t: '-ing or to?',
      ent: '<b>Verb + -ing</b>: enjoy, can’t stand, keep, mind, finish, avoid (<i>I enjoy playing</i>).<br><b>Verb + to + verbo</b>: decide, promise, hope, would like, want, plan (<i>I decided to learn</i>).<br><b>remember / forget</b> mudam de sentido:<br>• <b>remember / forget + to</b> = lembrar / esquecer <u>de fazer</u> algo (tarefa): <i>Remember to charge your phone.</i><br>• <b>remember / never forget + -ing</b> = lembrar de algo que <u>já aconteceu</u> (memória): <i>I remember meeting her.</i>',
      ins: 'Which pattern comes after each verb? Choose a box for each one.',
      cats: ['+ -ing', '+ to + verb'],
      items: [['enjoy',0],['decide',1],['can’t stand',0],['promise',1],['keep',0],['hope',1],['mind',0],['would like',1],['finish',0],['plan',1],['avoid',0],['want',1]] },
    { id: 'm2e', type: 'choose', t: 'The group project chat', ins: 'Choose the correct form.',

    { id: 'm2f', type: 'type', t: 'Make suggestions',
      ent: '<b>How about + -ing?</b> <i>How about going…?</i><br><b>Why don’t we + verbo base?</b> <i>Why don’t we go…?</i><br><b>Let’s + verbo base.</b> <i>Let’s go…</i><br><b>Shall we + verbo base?</b> <i>Shall we go…?</i><br>Para aceitar: <i>That’s a great idea! Sounds good!</i> Para recusar com educação: <i>I’m not sure… Maybe another time.</i>',

    { id: 'm3f', type: 'type', t: 'Irregular verbs workout',

    { id: 'm3k', type: 'sort', t: 'Time detective',
      ent: '<b>Simple Past</b>: tempo <u>terminado</u> e dito (<i>yesterday, last month, in 2019, two days ago, when I was a kid</i>).<br><b>Present Perfect</b>: sem tempo definido ou tempo que <u>ainda não terminou</u> (<i>ever, never, just, already, yet, so far, this week, since…, for…</i> até agora).<br>Dica: se você pode perguntar <b>“When?”</b> e a frase já responde, é Simple Past.',

      ins: 'Read Clara’s opinion text. Then answer the questions below.',
      text: '<h4>Food delivery apps: friend or enemy?</h4><p class="by">By Clara, 16</p><p>Five years ago, my family ordered food maybe once a month. Now my older brother uses a delivery app almost every day. He says it saves time, and I understand that. When you study and work, cooking can feel impossible. Delivery apps have also helped small restaurants: our favorite Lebanese place has doubled its customers since it joined an app.</p><p>However, I think we have started to depend on them too much. First, the food is usually expensive because of the delivery fees. Second, a lot of it comes in plastic boxes that we throw away after ten minutes. And third, we’ve stopped learning how to cook. My brother is 22 and he has never made rice!</p><p>I’m not saying we should delete the apps. They’re useful when you’re sick or really busy. But I believe we should use them as a treat, not as a habit. Last Sunday, my brother and I cooked pasta together for the first time. It wasn’t perfect, but it was cheaper, and honestly, it tasted better because we made it ourselves.</p><p>So here’s my suggestion: why don’t we try a “no-app week” once a month? You might discover that cooking is more fun than you think.</p>' ,

/* ---------- answer matching ---------- */
function base(s) {
  return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’‘`´]/g, "'")
    .replace(/[.!?,;:"“”()]/g, ' ').replace(/-/g, ' ').replace(/\s+/g, ' ').trim()
    .replace(/\bwon't\b/g, 'will not').replace(/\bcan't\b/g, 'cannot').replace(/\bcannot\b/g, 'can not')
    .replace(/n't\b/g, ' not').replace(/'ve\b/g, ' have').replace(/'re\b/g, ' are').replace(/'m\b/g, ' am')
    .replace(/'ll\b/g, ' will').replace(/'d\b/g, ' would').replace(/\blet's\b/g, 'let us').replace(/\s+/g, ' ').trim();
}
function variants(s) { const b = base(s); if (!/'s\b/.test(b)) return [b]; return [b.replace(/'s\b/g, ' has'), b.replace(/'s\b/g, ' is'), b]; }
function match(given, answers) {
  const g = variants(given); if (!g[0]) return false;
  return answers.some(a => variants(a).some(v => g.includes(v)));
}

/* ---------- deterministic shuffle ---------- */
function rng(seed) { let h = 1779033703 ^ seed.length; for (let i = 0; i < seed.length; i++) { h = Math.imul(h ^ seed.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; } return () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); return ((h ^= h >>> 16) >>> 0) / 4294967296; }; }
function shuffle(arr, seed) { const r = rng(seed), a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------- content helpers ---------- */
const GAPRE = /\[\[(.+?)\]\]/g;
function gaps(step) { return [...step.text.matchAll(GAPRE)].map(m => m[1].split('|')); }
function nItems(step) {
  if (step.type === 'gap') return gaps(step).length;
  if (['choose', 'type', 'sort', 'order', 'read'].includes(step.type)) return step.items.length;
  return 0;
}
function answerOf(step, i) {
  const it = step.items ? step.items[i] : null;
  switch (step.type) {
    case 'choose': case 'read': return it.o[it.a];
    case 'type': return it[1][0];
    case 'sort': return step.cats[it[1]];
    case 'order': return String(i + 1);
    case 'gap': return gaps(step)[i][0];
  }
  return '';
}
function isRight(step, i, v) {
  if (v === undefined || v === null || v === '') return false;
  const it = step.items ? step.items[i] : null;
  switch (step.type) {
    case 'choose': case 'read': return v === it.o[it.a];
    case 'type': return match(v, it[1]);
    case 'sort': return +v === it[1];
    case 'order': return +v === i + 1;
    case 'gap': return match(v, gaps(step)[i]);
  }
  return false;
}
const ALLSETS = () => MISSIONS.map(m => ({ ...m, kind: 'm' })).concat(HOMEWORK.map(h => ({ ...h, kind: 'h' })));

function speakWord(text, rate = .9, voiceIdx = 0, pitch = 1, onend) {
  try {
    const u = new SpeechSynthesisUtterance(text.replace(/–/g, ',')); u.lang = 'en-US'; u.rate = rate; u.pitch = pitch;
    const vs = speechSynthesis.getVoices().filter(v => /^en[-_]US/i.test(v.lang));
    if (vs.length) u.voice = vs[voiceIdx % vs.length];
    if (onend) u.onend = onend;
    speechSynthesis.speak(u);
  } catch (e) { if (onend) onend(); }
}

let R = { students: {}, hw: {} };
const url = p => `${DBURL}/aulas/${SALA}${p ? '/' + p : ''}.json`;
function setPath(path, data, merge) {
  const parts = path.split('/').filter(Boolean);
  if (!parts.length) { if (merge) { R = Object.assign(R || {}, data); for (const x in data) if (data[x] === null) delete R[x]; } else R = data || {}; return; }
  let o = R; for (let i = 0; i < parts.length - 1; i++) { if (typeof o[parts[i]] !== 'object' || o[parts[i]] === null) o[parts[i]] = {}; o = o[parts[i]]; }
  const k = parts[parts.length - 1];
  if (merge) { o[k] = Object.assign(typeof o[k] === 'object' && o[k] ? o[k] : {}, data); for (const x in data) if (data[x] === null) delete o[k][x]; }
  else if (data === null || data === undefined) delete o[k]; else o[k] = data;
}
let queue = [];
function put(path, val) { const v = val === undefined ? null : JSON.parse(JSON.stringify(val)); setPath(path, v, false); send('PUT', path, v); }
function patch(path, obj) { const v = JSON.parse(JSON.stringify(obj)); setPath(path, v, true); send('PATCH', path, v); }
function send(method, path, body) {
  if (LOCAL) { localStorage.setItem('t6_' + SALA, JSON.stringify(R)); return; }
  queue.push({ method, path, body }); flush();
}
let flushing = false;
async function flush() {
  if (flushing) return; flushing = true;
  while (queue.length) {
    const j = queue[0];
    try { const r = await fetch(url(j.path), { method: j.method, body: JSON.stringify(j.body) }); if (!r.ok) throw 0; queue.shift(); net(false); }
    catch (e) { net(true); await new Promise(r => setTimeout(r, 2500)); }
  }
  flushing = false;
}
function net(bad) { const n = $('#net'); if (n) n.style.display = bad ? 'block' : 'none'; }
function listen(prefix, onFirst) {
  if (LOCAL) { try { R = JSON.parse(localStorage.getItem('t6_' + SALA)) || R; } catch (e) { } R.students = R.students || {}; R.hw = R.hw || {}; onFirst && onFirst(); schedule();
    window.addEventListener('storage', e => { if (e.key === 't6_' + SALA) { try { R = JSON.parse(e.newValue) || R; } catch (x) { } schedule(); } }); return; }
  let first = true;
  const es = new EventSource(url(prefix));
  const apply = (d, merge) => { const p = (prefix ? prefix + '/' : '') + (d.path === '/' ? '' : d.path.replace(/^\//, '')); setPath(p.replace(/\/$/, ''), d.data, merge); if (first) { first = false; onFirst && onFirst(); } schedule(); };
  es.addEventListener('put', e => apply(JSON.parse(e.data), false));
  es.addEventListener('patch', e => apply(JSON.parse(e.data), true));
  es.onerror = () => net(true);
  es.onopen = () => { if (!queue.length) net(false); };
}

function setStats(set) {

  let h = `<header class="top"><div class="logo"><img class="li" src="${LOGO_I}" alt=""><div><img class="lw" src="${LOGO_W}" alt="Educa&amp;Cia"><small>Teens 6 · Exam Review · Teacher</small></div></div>${UI.view === 'student' && stu() ? `<div class="coins">${COIN}<b>${coins()}</b></div>` : ''}</header>`;
  h += `<nav class="tabs tt"><button class="tab ${UI.view === 'dash' ? 'on' : ''}" data-act="tview" data-v="dash">Students</button><button class="tab ${UI.view === 'hwm' ? 'on' : ''}" data-act="tview" data-v="hwm">Send homework</button><button class="tab ${UI.view === 'notes' ? 'on' : ''}" data-act="tview" data-v="notes">Teacher’s notes & key</button>${UI.view === 'student' && stu() ? `<button class="tab on">${esc(stu().name)}</button>` : ''}</nav>`;
  if (UI.view === 'student' && stu()) {
    const s = stu(); const online = Date.now() - (s.seen || 0) < 45000;
    h += `<div class="tbar"><span class="dot ${online ? 'on' : ''}"></span><b>${esc(s.name)}</b>
      <span class="grp"><span class="muted sm">Coins</span><button class="mini" data-act="give" data-n="1">+1</button><button class="mini" data-act="give" data-n="2">+2</button><button class="mini" data-act="give" data-n="3">+3</button><button class="mini ghost" data-act="give" data-n="-1">−1</button></span>
      <label class="sm"><input type="checkbox" data-act="together" ${UI.together ? 'checked' : ''}> Move together</label>
      <label class="sm"><input type="checkbox" data-act="key" ${UI.key ? 'checked' : ''}> Answer key</label>
      <span class="grp"><input class="inp sm" data-keep="msg" placeholder="Message to ${esc(s.name)}…"><button class="mini" data-act="sendmsg">Send</button></span>
      <button class="mini ghost" data-act="reset">${UI.confirm === 'reset' ? 'Click again to erase all her progress' : 'Start over'}</button></div>`;
    h += tabs() + `<main class="wrap">${renderPos()}</main>`;
    return h;
  }
  if (UI.view === 'hwm') return h + `<main class="wrap">${renderHwManager(studs)}</main>`;
  if (UI.view === 'notes') return h + `<main class="wrap">${renderNotes()}</main>`;
  // dashboard
  h += `<main class="wrap"><section class="intro"><h1>Students</h1><p>Student link: <a href="${studentLink()}" target="_blank">${esc(studentLink())}</a> · Each student types her first name and does the review individually. Click a name to see her screen live.</p></section>`;
  if (!studs.length) return h + `<div class="card muted">No students yet. When a student opens the link and types her name, she appears here.</div></main>`;
  h += `<div class="card"><table class="tbl"><tr><th></th><th>Student</th><th>Coins</th><th>Now on</th><th>Review done</th><th>First try</th><th>Homework</th><th></th></tr>`;
  studs.forEach(([id, s]) => {
    const st = stuStats(id); const online = Date.now() - (s.seen || 0) < 45000;
    const p = s.pos || { v: 'map' }; let now = { map: 'Missions', hw: 'Homework list', res: 'Results' }[p.v] || '';
    if (p.v === 'm' || p.v === 'h') { const set = findSet(p.m); if (set) now = `${set.t} · step ${(p.s || 0) + 1}`; }
    const hw = myHomework(id); const hwd = hw.filter(([k, x]) => hwDone(id, k, x)).length;
    h += `<tr><td><span class="dot ${online ? 'on' : ''}"></span></td><td><button class="link b" data-act="opens" data-id="${id}">${esc(s.name)}</button></td><td>${COIN} ${s.coins || 0}</td><td class="sm">${esc(now)}</td><td><span class="bar sm"><i style="width:${st.pct}%"></i></span> ${st.pct}%</td><td>${st.fpct === null ? '–' : st.fpct + '%'}</td><td>${hw.length ? hwd + '/' + hw.length : '–'}</td><td><button class="mini ghost" data-act="del" data-id="${id}">${UI.confirm === 'del' + id ? 'Click again to remove' : 'Remove'}</button></td></tr>`;
  });
  return h + `</table></div><p class="muted sm">Green dot = online now. Removing a student erases her coins and answers.</p></main>`;
}
function studentLink() { return location.origin + location.pathname + (SALA !== 'teens6-review' ? '?sala=' + SALA : ''); }
function renderHwManager(studs) {
  const F = UI.hwf; const so = (v, cur) => v === cur ? 'selected' : '';
  let h = `<section class="intro"><h1>Send homework</h1><p>Students see it in their <b>Homework</b> tab on the same link.</p></section><div class="card form">
  <label class="lbl">Activity</label><select class="sel w" id="hwset" data-f="set">${HOMEWORK.map(x => `<option value="${x.id}" ${so(x.id, F.set)}>${esc(x.t)} – ${esc(x.sub)}</option>`).join('')}<option value="custom" ${so('custom', F.set)}>Custom task (write your own)</option></select>
  <div id="hwcustom" class="${F.set === 'custom' ? '' : 'hide'}"><label class="lbl">Task title</label><input class="inp w" id="hwtitle" data-f="title" data-keep="hwtitle" value="${esc(F.title)}" placeholder="e.g. Workbook page 14, exercises 2 and 3"></div>
  <label class="lbl">Send to</label><select class="sel w" id="hwto" data-f="to"><option value="all">All students</option>${studs.map(([id, s]) => `<option value="${id}" ${so(id, F.to)}>${esc(s.name)}</option>`).join('')}</select>
  <label class="lbl">Note (optional)</label><input class="inp w" id="hwnote" data-f="note" data-keep="hwnote" value="${esc(F.note)}" placeholder="e.g. Do it before Thursday’s class">
  <label class="lbl">Due date (optional)</label><input class="inp" type="date" id="hwdue" data-f="due" value="${esc(F.due)}">
  <div class="row"><button class="btn" data-act="sendhw">Send homework</button><button class="btn ghost" data-act="sendpack">Send the whole pack (${HOMEWORK.length} activities, in order, ending with the Final review)</button></div></div>`;
  const list = Object.entries(R.hw || {}).sort((a, b) => (a[1].ts || 0) - (b[1].ts || 0));
  h += `<h3>Sent</h3>`;
  if (!list.length) h += `<div class="card muted">Nothing sent yet.</div>`;
  list.forEach(([k, x]) => {
    const set = x.set === 'custom' ? null : findSet(x.set);
    const targets = x.to === 'all' ? studs : studs.filter(([id]) => id === x.to);
    h += `<div class="card hwrow"><div class="row between"><div><b>${esc(set ? set.t : (x.title || 'Custom task'))}</b> <span class="muted sm">→ ${x.to === 'all' ? 'all students' : esc((R.students[x.to] || {}).name || x.to)}${x.due ? ' · due ' + esc(fmtDate(x.due)) : ''}</span>${x.note ? `<div class="sm">${esc(x.note)}</div>` : ''}</div><button class="mini ghost" data-act="delhw" data-k="${k}">${UI.confirm === 'hw' + k ? 'Click again to delete' : 'Delete'}</button></div>
    <div class="chips">${targets.map(([id, s]) => { const d = hwDone(id, k, x); let extra = ''; if (set) { const save = UI.sel; UI.sel = id; const st = setStats(set); UI.sel = save; extra = st.n ? ` ${st.done}/${st.n}` : ''; } return `<button class="chip ${d ? 'on' : ''}" data-act="openhw" data-id="${id}" data-m="${set ? set.id : ''}">${esc(s.name)}${extra}${d ? ' ✓' : ''}</button>`; }).join('')}</div></div>`;
  });
  return h;
}
function renderNotes() {
  let h = `<div class="card notes">${NOTES}</div><div class="card notes"><h3>Answer key</h3>`;
  const keyOf = st => {
    const n = nItems(st);
    if (st.type === 'words') return '<span class="muted">Vocabulary presentation.</span>';
    if (st.type === 'speak') return `<span class="muted">Speaking. Listen for: ${esc(st.listen)}</span>`;
    if (st.type === 'write') return `<span class="muted">Writing (${st.min}–${st.max} words). Checklist: ${esc(st.check.join(' · '))}</span>`;
    let out = '<ol>';
    for (let i = 0; i < n; i++) out += `<li>${st.type === 'order' ? esc(st.items[i]) : esc(keyText(st, i))}</li>`;
    return out + '</ol>' + (st.type === 'order' ? '<span class="muted sm">(correct order)</span>' : '');
  };
  ALLSETS().forEach(set => {
    h += `<h4>${set.kind === 'h' ? 'Homework' : 'Mission'} · ${esc(set.t)}</h4>`;
    set.steps.forEach((st, i) => { h += `<div class="krow"><b>${i + 1}. ${esc(st.t)}</b>${keyOf(st)}${st.audio ? `<details><summary>Audio script</summary>${st.audio.lines.map(l => `<p><b>${esc(l[0])}:</b> ${esc(l[1])}</p>`).join('')}</details>` : ''}</div>`; });
  });
  return h + '</div>';
}

/* ================= EVENTS ================= */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'INPUT' && b.type !== 'checkbox') return;
  const a = b.dataset.act; const d = b.dataset;
  if (a !== 'showall' && a !== 'reset' && a !== 'del' && a !== 'delhw') UI.confirm = null;
  const p = pos();
  const curSet = () => findSet(p.m);
  const stepById = id => findStep(id);
  switch (a) {
    case 'login': { const v = $('#nm').value.trim(); if (!v) return; const id = slug(v.split(/\s+/)[0]) || slug(v); if (!id) return; localStorage.setItem('t6_me_' + SALA, id); localStorage.setItem('t6_nm_' + SALA, v.split(/\s+/)[0]); ME = id; startStudent(); render(); break; }
    case 'tab': go({ v: d.v }); break;
    case 'open': go({ v: d.kind === 'h' ? 'h' : 'm', m: d.m, s: 0 }); break;
    case 'step': { const set = curSet(); const s = +d.s; if (!set || s < 0 || s >= set.steps.length) return; go({ v: p.v, m: p.m, s }); break; }
    case 'word': { UI.words[d.k] = !UI.words[d.k]; speechSynthesis.cancel(); speakWord(d.say); render(); break; }
    case 'pick': { const set = curSet(); const step = stepById(d.st); const i = +d.i; const st = itemSt(step.id, i); if (locked(st)) return; evaluate(set, step, i, d.v); render(); break; }
    case 'check': { checkStep(curSet(), stepById(d.st)); render(); break; }
    case 'retry': retry(stepById(d.st), +d.i, false); render(); break;
    case 'free': retry(stepById(d.st), +d.i, true); render(); break;
    case 'show': showAns(stepById(d.st), +d.i); render(); break;
    case 'showall': if (UI.confirm === d.st) { UI.confirm = null; showAll(stepById(d.st)); } else UI.confirm = d.st; render(); break;
    case 'play': play(stepById(d.st)); break;
    case 'slow': UI.slow = b.checked; break;
    case 'script': UI.script[d.st] = !UI.script[d.st]; render(); break;
    case 'draw': { const step = stepById(d.st); const s = stu(); const c = (s.card && s.card[step.id]) || { i: -1, used: [] }; let used = (c.used || []).slice(); if (used.length >= step.cards.length) used = []; const left = step.cards.map((x, i) => i).filter(i => !used.includes(i)); const i = left[Math.floor(Math.random() * left.length)]; used.push(i); put(P(`card/${step.id}`), { i, used }); render(); break; }
    case 'sendw': { const step = stepById(d.st); const ta = document.querySelector(`[data-keep="w-${step.id}"]`); const text = ta ? ta.value : ''; const n = text.trim().split(/\s+/).filter(Boolean).length; if (n < 20) { toast('Write your email first.'); return; } patch(P(`w/${step.id}`), { text, sent: Date.now() }); toast('Sent! Your teacher will read it and give you feedback.'); render(); break; }
    case 'unsend': patch(P(`w/${d.st}`), { sent: null }); render(); break;
    case 'msgok': localStorage.setItem('t6_msg_' + SALA + ME, d.ts); render(); break;
    case 'hwdone': { const s = stu(); const cur = s.hwdone && s.hwdone[d.k]; put(P(`hwdone/${d.k}`), cur ? null : 1); render(); break; }
    // teacher
    case 'tview': UI.view = d.v; render(); break;
    case 'opens': UI.sel = d.id; UI.view = 'student'; UI.local = { v: 'map' }; render(); window.scrollTo(0, 0); break;
    case 'openhw': UI.sel = d.id; UI.view = 'student'; if (d.m) { if (UI.together) put(P('pos'), { v: 'h', m: d.m, s: 0 }); else UI.local = { v: 'h', m: d.m, s: 0 }; } render(); break;
    case 'give': addCoins(+d.n); render(); break;
    case 'together': UI.together = b.checked; if (!UI.together) UI.local = JSON.parse(JSON.stringify((stu() && stu().pos) || { v: 'map' })); render(); break;
    case 'key': UI.key = b.checked; render(); break;
    case 'sendmsg': { const el = document.querySelector('[data-keep="msg"]'); const t = el.value.trim(); if (!t) return; put(P('msg'), { t, ts: Date.now() }); el.value = ''; toast('Message sent.'); break; }
    case 'reset': if (UI.confirm === 'reset') { UI.confirm = null; const s = stu(); put(`students/${sid()}`, { name: s.name, coins: START_COINS, joined: s.joined || Date.now(), seen: s.seen || 0, pos: { v: 'map' } }); } else UI.confirm = 'reset'; render(); break;
    case 'del': if (UI.confirm === 'del' + d.id) { UI.confirm = null; put(`students/${d.id}`, null); } else UI.confirm = 'del' + d.id; render(); break;
    case 'sendhw': {
      const F = UI.hwf; const set = F.set, to = F.to, note = F.note.trim(), due = F.due, title = set === 'custom' ? F.title : '';
      if (set === 'custom' && !title.trim()) { toast('Write the task title.'); return; }
      const k = 'hw' + Date.now().toString(36);
      put(`hw/${k}`, { set, to, note, due, title: title.trim(), ts: Date.now() });
      F.note = ''; F.title = '';
      toast('Homework sent.'); render(); break;
    }
    case 'sendpack': {
      const F = UI.hwf; const t0 = Date.now();
      HOMEWORK.forEach((x, n) => put(`hw/hw${(t0 + n).toString(36)}`, { set: x.id, to: F.to, note: x.final ? (F.note.trim() || 'Do this last, before the exam.') : F.note.trim(), due: F.due, title: '', ts: t0 + n }));
      toast('Homework pack sent.'); render(); break;
    }
    case 'delhw': if (UI.confirm === 'hw' + d.k) { UI.confirm = null; put(`hw/${d.k}`, null); } else UI.confirm = 'hw' + d.k; render(); break;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.f) { UI.hwf[t.dataset.f] = t.value; if (t.id === 'hwset') { const c = $('#hwcustom'); if (c) c.classList.toggle('hide', t.value !== 'custom'); } }
  if (t.matches('select[data-k]')) { const [stepId, i] = t.dataset.k.split(':'); const cur = itemSt(stepId, i); put(P(`a/${stepId}/${i}`), Object.assign({}, cur, { v: t.value })); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('input[data-k]')) onType(t);
  if (t.dataset.f) UI.hwf[t.dataset.f] = t.value;
  if (t.dataset.actInput === 'write') { const n = t.value.trim().split(/\s+/).filter(Boolean).length; const wc = $('#wc'); if (wc) wc.textContent = n; clearTimeout(typeT.w); typeT.w = setTimeout(() => patch(P(`w/${t.dataset.st}`), { text: t.value }), 500); }
  if (t.dataset.actInput === 'fb') { clearTimeout(typeT.fb); typeT.fb = setTimeout(() => patch(P(`w/${t.dataset.st}`), { fb: t.value }), 500); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const t = e.target;
  if (t.id === 'nm') { $('[data-act="login"]').click(); return; }
  if (t.matches('input[data-k]')) { e.preventDefault(); const stepId = t.dataset.k.split(':')[0]; const btn = document.querySelector(`[data-act="check"][data-st="${stepId}"]`); if (btn) btn.click(); }
  if (t.dataset.keep === 'msg') $('[data-act="sendmsg"]').click();
});

/* ================= START ================= */
function startStudent() {
  listen(`students/${ME}`, () => {
    if (!stu()) { const nm = localStorage.getItem('t6_nm_' + SALA) || ME; put(`students/${ME}`, { name: nm.charAt(0).toUpperCase() + nm.slice(1), coins: START_COINS, joined: Date.now(), seen: Date.now(), pos: { v: 'map' } }); }
  });
  if (!LOCAL) listen('hw');
  const beat = () => { if (stu()) put(P('seen'), Date.now()); };
  setTimeout(beat, 1500); setInterval(beat, 20000);
}
if (PROF) { listen(''); setInterval(() => { if (UI.view !== 'student') schedule(); }, 15000); }
else if (ME) startStudent();
render();
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => { };
</script></body></html>
